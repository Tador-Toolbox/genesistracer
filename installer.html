<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Installer Panel - Tador</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0d14;
      --surface: #111520;
      --surface2: #161c2e;
      --border: #1e2840;
      --accent: #2563eb;
      --green: #10b981;
      --text: #f1f5f9;
      --text-dim: #64748b;
    }

    body.light {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface2: #e8edf5;
      --border: #cbd5e1;
      --accent: #2563eb;
      --green: #059669;
      --text: #0f172a;
      --text-dim: #64748b;
    }

    .theme-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      padding: 8px 14px;
      width: auto;
      margin-top: 0;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container { max-width: 600px; width: 100%; }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
    }
    
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--text-dim); margin-bottom: 32px; }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    
    input, select {
      width: 100%;
      padding: 14px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 24px;
    }
    
    button:hover { opacity: 0.9; }
    
    .result {
      margin-top: 24px;
      padding: 20px;
      background: var(--surface2);
      border-radius: 10px;
    }
    
    .result h3 {
      font-size: 14px;
      color: var(--green);
      margin-bottom: 12px;
    }
    
    .ip-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      color: var(--green);
      margin-bottom: 16px;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      font-size: 13px;
    }
    
    .info-item {
      background: var(--bg);
      padding: 10px;
      border-radius: 6px;
    }
    
    .info-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    
    .info-value {
      font-family: 'JetBrains Mono', monospace;
    }
    
    .logout-btn {
      margin-top: 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    
    .mac-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    
    .mac-card:hover { border-color: var(--accent); }
    .mac-card.selected { border-color: var(--accent); background: rgba(37,99,235,0.08); }
    
    .mac-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .mac-address {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }
    
    .mac-description {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 4px;
    }
    
    .mac-description.has-value {
      color: var(--text);
      font-style: normal;
    }
    
    .edit-desc-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      margin-top: 0;
    }
    
    .edit-desc-btn:hover { border-color: var(--accent); color: var(--accent); }
    
    .desc-input-wrap {
      display: none;
      margin-top: 10px;
      gap: 8px;
      flex-direction: column;
    }
    
    .desc-input-wrap.open { display: flex; }
    
    .desc-input-wrap input {
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .desc-save-btn {
      padding: 8px;
      background: var(--green);
      color: white;
      font-size: 13px;
      width: auto;
      margin-top: 0;
    }
    
    .lang-switch {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      margin-top: 24px;
      justify-content: center;
    }
    
    .lang-btn {
      padding: 8px 16px;
      background: transparent;
      color: var(--text-dim);
      border: none;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    
    .lang-btn.active {
      background: var(--accent);
      color: white;
    }
    
    #installerPanel { display: none; }
  </style>
  <script>
    // Set Hebrew and light theme IMMEDIATELY
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  </script>
</head>
<body class="light">
  <!-- Login Screen -->
  <div id="loginScreen" class="container">
    <div class="card">
      <h1 data-i18n="loginTitle">כניסת מתקין</h1>
      <p class="subtitle">Tador Technologies LTD</p>
      
      <div class="form-group">
        <label data-i18n="phoneLabel">מספר טלפון</label>
        <input type="text" id="loginPhone" data-i18n-placeholder="phonePlaceholder" placeholder="0501234567+972" />
      </div>
      
      <div class="form-group">
        <label data-i18n="passwordLabel">סיסמה</label>
        <input type="password" id="loginPassword" data-i18n-placeholder="passwordPlaceholder" placeholder="סיסמה" />
      </div>
      
      <button onclick="login()" data-i18n="loginBtn">התחבר</button>
      <div id="loginError" style="color: var(--red); margin-top: 12px; text-align: center;"></div>
      
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn active" data-lang="he">עברית</button>
      </div>
      <div style="text-align: center; margin-top: 12px;">
        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </div>

  <!-- Installer Panel -->
  <div id="installerPanel" class="container">
    <div class="card">
      <h1 data-i18n="panelTitle">Device Lookup</h1>
      <p class="subtitle" data-i18n="panelSubtitle">Select a MAC address to find device IP</p>
      <button onclick="openInstallerChat()" style="width:100%;padding:10px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:white;font-weight:600;font-size:14px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        צ'אט תמיכה עם מנהל
        <span id="installerUnreadBadge" style="display:none;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center;"></span>
      </button>

      <!-- Chat Modal -->
      <div id="installerChatOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
        <div style="background:var(--surface);border-radius:14px;width:360px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.2);direction:rtl;overflow:hidden;">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);">
            <h3 style="margin:0;font-size:16px;display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> צ'אט תמיכה</h3>
            <button onclick="closeInstallerChat()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-dim);">✕</button>
          </div>
          <div id="installerChatMessages" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:260px;max-height:380px;"></div>
          <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;">
            <input id="installerChatInput" type="text" placeholder="הקלד הודעה..." style="flex:1;padding:9px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;" onkeydown="if(event.key==='Enter')sendInstallerMessage()" />
            <button onclick="sendInstallerMessage()" style="padding:9px 16px;background:#7c3aed;color:white;border:none;border-radius:20px;cursor:pointer;font-weight:600;">שלח</button>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label data-i18n="macLabel">Your MAC Addresses</label>
        <div id="macList"></div>
      </div>
      
      <button onclick="lookup()">
        <span>🔍</span>
        <span data-i18n="lookupBtn">חפש IP מכשיר</span>
      </button>
      
      <div id="result"></div>

      <button id="rebootBtn" onclick="rebootDevice()" style="margin-top:8px;width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:white;">
        <span>🔄</span>
        <span data-i18n="rebootBtn">אתחול מכשיר</span>
      </button>
      <div id="rebootResult" style="margin-top:8px;font-size:13px;text-align:center;"></div>

      <div id="catalogSection" style="display:block;margin-top:8px;">
        <button id="catalogLink" onclick="openCatalog()" style="display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:11px;border-radius:10px;background:linear-gradient(135deg,#e8572a,#c43b12);color:white;font-weight:600;font-size:14px;cursor:pointer;border:none;width:100%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span data-i18n="catalogBtn">הורדת קטלוג מוצרים</span>
        </button>
      </div>

      <button onclick="openSubscribeModal()" style="margin-top:8px;width:100%;padding:11px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;">📧 הירשמו לקבלת עדכונים ראשונים על מוצרים חדשים, כלים והטבות</button>

      <button class="logout-btn" onclick="logout()" data-i18n="logoutBtn" style="margin-top:8px;">התנתק</button>

      <!-- Subscribe Modal -->
      <div id="subscribeOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;">
        <div style="background:var(--surface);border-radius:14px;padding:28px 24px;width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.18);direction:rtl;">
          <h3 style="margin:0 0 6px;font-size:17px;">📧 הירשמו לקבלת עדכונים ראשונים על מוצרים חדשים, כלים והטבות</h3>
          <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">קבל עדכונים ומבצעים מתדאור ישירות למייל</p>
          <label style="font-size:13px;font-weight:600;color:var(--text-dim);">שם מלא</label>
          <input id="subName" type="text" placeholder="ישראל ישראלי" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;margin:6px 0 12px;box-sizing:border-box;" />
          <label style="font-size:13px;font-weight:600;color:var(--text-dim);">אימייל</label>
          <input id="subEmail" type="email" placeholder="example@gmail.com" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;margin:6px 0 16px;box-sizing:border-box;" />
          <div id="subMsg" style="font-size:13px;min-height:18px;margin-bottom:10px;"></div>
          <div style="display:flex;gap:10px;">
            <button onclick="submitSubscribe()" style="flex:1;padding:11px;border-radius:8px;background:var(--accent);color:white;font-weight:700;border:none;cursor:pointer;font-size:14px;">הרשם</button>
            <button onclick="closeSubscribeModal()" style="flex:1;padding:11px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;cursor:pointer;font-size:14px;">ביטול</button>
          </div>
        </div>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
        <div class="lang-switch" style="margin-top: 0;">
          <button class="lang-btn" data-lang="en">English</button>
          <button class="lang-btn active" data-lang="he">עברית</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </div>

  <script>
    // Translations
    const translations = {
      en: {
        loginTitle: "Installer Login",
        phoneLabel: "Phone Number",
        phonePlaceholder: "+972501234567",
        passwordLabel: "Password",
        passwordPlaceholder: "Password",
        loginBtn: "Login",
        panelTitle: "Device Lookup",
        panelSubtitle: "Select a MAC address to find device IP",
        macLabel: "Your MAC Addresses",
        lookupBtn: "Remote Access",
        logoutBtn: "Logout",
        rebootBtn: "Reboot Device",
        catalogBtn: "Download Product Catalog",
        deviceFound: "DEVICE FOUND",
        error: "ERROR",
        mac: "MAC",
        serial: "SERIAL",
        project: "PROJECT",
        status: "STATUS",
        openBackend: "Connect",
        addDescription: "Add description...",
        editDescription: "✏️ Edit",
        saveDescription: "Save",
        descriptionLabel: "📝 Description",
        noDescription: "No description yet — click Edit to add one",
      },
      he: {
        loginTitle: "כניסת מתקין",
        phoneLabel: "מספר טלפון",
        phonePlaceholder: "0501234567+972",
        passwordLabel: "סיסמה",
        passwordPlaceholder: "סיסמה",
        loginBtn: "התחבר",
        panelTitle: "חיפוש מכשיר",
        panelSubtitle: "בחר כתובת MAC כדי למצוא IP של המכשיר",
        macLabel: "כתובות MAC שלך",
        lookupBtn: "מצא IP של המכשיר",
        logoutBtn: "התנתק",
        deviceFound: "מכשיר נמצא",
        error: "שגיאה",
        mac: "MAC",
        serial: "מספר סידורי",
        project: "פרויקט",
        status: "סטטוס",
        openBackend: "התחבר",
        addDescription: "הוסף תיאור...",
        editDescription: "✏️ ערוך",
        saveDescription: "שמור",
        descriptionLabel: "📝 תיאור",
        noDescription: "אין תיאור עדיין — לחץ ערוך להוספה",
      }
    };

    let currentLang = 'he'; // default Hebrew

    function toggleTheme() {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      document.querySelectorAll('.theme-btn').forEach(b => b.textContent = isLight ? '🌙' : '☀️');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    // Default to light theme
    if (localStorage.getItem('theme') !== 'dark') {
      document.body.classList.add('light');
      document.querySelectorAll('.theme-btn').forEach(b => b.textContent = '🌙');
    }
    if (!localStorage.getItem('theme')) {
      localStorage.setItem('theme', 'light');
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      
      // Update text elements
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      
      // Update placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (translations[lang][key]) {
          el.placeholder = translations[lang][key];
        }
      });
      
      // Update active button
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }

    // Language switcher
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('lang-btn')) {
        setLanguage(e.target.dataset.lang);
      }
    });

    let installerData = null;
    let selectedMac = null;

    function renderMacList() {
      const t = translations[currentLang];
      const container = document.getElementById('macList');
      container.innerHTML = installerData.macAddresses.map(macObj => `
        <div class="mac-card ${selectedMac === macObj.mac ? 'selected' : ''}" 
             id="card-${macObj.mac}" onclick="selectMac('${macObj.mac}')">
          <div class="mac-card-header">
            <span class="mac-address">${macObj.mac}</span>
            <button class="edit-desc-btn" onclick="event.stopPropagation(); toggleDescEdit('${macObj.mac}')">
              ${t.editDescription}
            </button>
          </div>
          <div class="mac-description ${macObj.description ? 'has-value' : ''}">
            ${macObj.description ? '📝 ' + macObj.description : t.noDescription}
          </div>
          <div class="desc-input-wrap" id="desc-wrap-${macObj.mac}">
            <input type="text" id="desc-input-${macObj.mac}" 
                   value="${macObj.description || ''}" 
                   placeholder="${t.addDescription}" 
                   onclick="event.stopPropagation()" />
            <button class="desc-save-btn" onclick="event.stopPropagation(); saveDescription('${macObj.mac}')">
              ${t.saveDescription}
            </button>
          </div>
        </div>
      `).join('');
    }

    function selectMac(mac) {
      selectedMac = mac;
      renderMacList();
    }

    function toggleDescEdit(mac) {
      const wrap = document.getElementById(`desc-wrap-${mac}`);
      wrap.classList.toggle('open');
      if (wrap.classList.contains('open')) {
        document.getElementById(`desc-input-${mac}`).focus();
      }
    }

    async function saveDescription(mac) {
      const description = document.getElementById(`desc-input-${mac}`).value;
      
      await fetch('/api/installer/description', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber: installerData.phoneNumber, mac, description })
      });

      // Update local data
      const macObj = installerData.macAddresses.find(m => m.mac === mac);
      if (macObj) macObj.description = description;
      
      document.getElementById(`desc-wrap-${mac}`).classList.remove('open');
      renderMacList();
    }

    async function login() {
      const phoneNumber = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;
      
      const res = await fetch('/api/installer/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber, password })
      });
      
      const data = await res.json();
      if (data.success) {
        installerData = data.data;
        selectedMac = installerData.macAddresses.length > 0 ? installerData.macAddresses[0].mac : null;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('installerPanel').style.display = 'block';
        renderMacList();
        loadCatalog();
        loadManagerNote(installerData.phoneNumber);
      } else {
        document.getElementById('loginError').textContent = data.error || 'Login failed';
      }
    }

    function logout() {
      installerData = null;
      selectedMac = null;
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('installerPanel').style.display = 'none';
      document.getElementById('loginPhone').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginError').textContent = '';
      document.getElementById('result').innerHTML = '';
    }
    // Auto-login from manager remote access
    window.addEventListener('DOMContentLoaded', () => {
      setLanguage('he');
      const storedData = sessionStorage.getItem('installerData');
      if (storedData) {
        try {
          installerData = JSON.parse(storedData);
          selectedMac = installerData.macAddresses.length > 0 ? installerData.macAddresses[0].mac : null;
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('installerPanel').style.display = 'block';
          renderMacList();
          loadCatalog();
          loadManagerNote(installerData.phoneNumber);
          // Clear sessionStorage after use
          sessionStorage.removeItem('installerData');
        } catch (err) {
          console.error('Auto-login failed:', err);
        }
      }
    });



    async function lookup() {
      if (!selectedMac) return alert('Please select a MAC address');
      const mac = selectedMac;
      
      const res = await fetch('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mac })
      });
      
      const data = await res.json();
      const resultDiv = document.getElementById('result');
      
      if (data.success) {
        resultDiv.innerHTML = `
          <div class="result">
            <h3>✓ ${translations[currentLang].deviceFound}</h3>
            <div class="ip-display">${data.fullAddress || data.ip}</div>
            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">${translations[currentLang].mac}</div>
                <div class="info-value">${data.mac}</div>
              </div>
              <div class="info-item">
                <div class="info-label">${translations[currentLang].serial}</div>
                <div class="info-value">${data.sn || 'N/A'}</div>
              </div>
              <div class="info-item">
                <div class="info-label">${translations[currentLang].project}</div>
                <div class="info-value">${data.project || 'N/A'}</div>
              </div>
              <div class="info-item">
                <div class="info-label">${translations[currentLang].status}</div>
                <div class="info-value">${data.status || 'N/A'}</div>
              </div>
            </div>
            ${data.fullAddress ? `
              <button onclick="window.open('http://${data.fullAddress}', '_blank')" style="margin-top: 16px;">
                🌐 ${translations[currentLang].openBackend}
              </button>
            ` : ''}
          </div>
        `;
      } else {
        resultDiv.innerHTML = `
          <div class="result" style="background: rgba(239, 68, 68, 0.1);">
            <h3 style="color: var(--red);">✗ ${translations[currentLang].error}</h3>
            <p>${data.error}</p>
          </div>
        `;
      }
    }

    // ==================== REBOOT ====================
    async function rebootDevice() {
      if (!selectedMac) return alert('בחר MAC תחילה');
      const btn = document.getElementById('rebootBtn');
      const res = document.getElementById('rebootResult');
      btn.disabled = true;
      btn.querySelector('span:last-child').textContent = 'מאתחל...';
      res.textContent = '';
      try {
        const r = await fetch('/api/installer/reboot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mac: selectedMac })
        });
        const data = await r.json();
        if (data.success) {
          res.style.color = 'var(--green, #1a9e6e)';
          res.textContent = '✅ פקודת אתחול נשלחה בהצלחה';
        } else {
          res.style.color = 'var(--red, #d63b3b)';
          res.textContent = '❌ ' + (data.error || 'שגיאה');
        }
      } catch(e) {
        res.style.color = 'var(--red, #d63b3b)';
        res.textContent = '❌ שגיאת תקשורת';
      }
      btn.disabled = false;
      const t = translations[currentLang];
      btn.querySelector('span:last-child').textContent = t?.rebootBtn || 'אתחול מכשיר';
    }

    // ==================== INSTALLER CHAT ====================
    let installerChatPoll = null;

    function openInstallerChat() {
      document.getElementById('installerChatOverlay').style.display = 'flex';
      loadInstallerChatMessages();
      fetch(`/api/chat/${installerData.phoneNumber}/read`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from:'installer' }) });
      document.getElementById('installerUnreadBadge').style.display = 'none';
      installerChatPoll = setInterval(loadInstallerChatMessages, 3000);
    }

    function closeInstallerChat() {
      document.getElementById('installerChatOverlay').style.display = 'none';
      clearInterval(installerChatPoll);
      installerChatPoll = null;
    }

    async function loadInstallerChatMessages() {
      if (!installerData?.phoneNumber) return;
      try {
        const res = await fetch(`/api/chat/${installerData.phoneNumber}`);
        const data = await res.json();
        const container = document.getElementById('installerChatMessages');
        const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;
        container.innerHTML = data.messages.length === 0
          ? '<div style="text-align:center;color:var(--text-dim);font-size:13px;margin-top:40px;">אין הודעות עדיין</div>'
          : data.messages.map(m => {
              const isInstaller = m.from === 'installer';
              const time = new Date(m.timestamp).toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
              return `<div style="display:flex;flex-direction:column;align-items:${isInstaller?'flex-start':'flex-end'};">
                <div style="max-width:75%;padding:8px 12px;border-radius:${isInstaller?'4px 16px 16px 16px':'16px 4px 16px 16px'};background:${isInstaller?'#7c3aed':'var(--surface2)'};color:${isInstaller?'white':'var(--text)'};font-size:14px;">${m.text}</div>
                <span style="font-size:10px;color:var(--text-dim);margin-top:2px;">${isInstaller?'אתה':'מנהל'} · ${time}</span>
              </div>`;
            }).join('');
        if (wasAtBottom) container.scrollTop = container.scrollHeight;
      } catch(e) {}
    }

    async function sendInstallerMessage() {
      const input = document.getElementById('installerChatInput');
      const text = input.value.trim();
      if (!text || !installerData?.phoneNumber) return;
      input.value = '';
      await fetch(`/api/chat/${installerData.phoneNumber}`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ from:'installer', text })
      });
      loadInstallerChatMessages();
    }

    async function checkInstallerUnread() {
      if (!installerData?.phoneNumber) return;
      try {
        const res = await fetch(`/api/chat/${installerData.phoneNumber}`);
        const data = await res.json();
        const unread = data.messages.filter(m => m.from === 'manager' && !m.read).length;
        const badge = document.getElementById('installerUnreadBadge');
        if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-block'; }
        else { badge.style.display = 'none'; }
      } catch(e) {}
    }

    async function loadManagerNote(phoneNumber) {
      // check for unread messages
      await checkInstallerUnread();
      setInterval(checkInstallerUnread, 30000);
    }

    // ==================== CATALOG ====================
    let catalogUrl = 'https://www.tador.com';

    async function loadCatalog() {
      try {
        const res = await fetch('/api/catalog');
        const data = await res.json();
        if (data.url) catalogUrl = data.url;
        document.getElementById('catalogSection').style.display = 'block';
      } catch(e) {}
    }

    function openCatalog() {
      window.open(catalogUrl, '_blank');
    }

    // ==================== SUBSCRIBE ====================
    function openSubscribeModal() {
      document.getElementById('subName').value = '';
      document.getElementById('subEmail').value = '';
      document.getElementById('subMsg').textContent = '';
      const overlay = document.getElementById('subscribeOverlay');
      overlay.style.display = 'flex';
    }

    function closeSubscribeModal() {
      document.getElementById('subscribeOverlay').style.display = 'none';
    }

    async function submitSubscribe() {
      const name = document.getElementById('subName').value.trim();
      const email = document.getElementById('subEmail').value.trim();
      const msg = document.getElementById('subMsg');
      if (!name || !email) { msg.style.color = 'var(--red)'; msg.textContent = 'נא למלא שם ואימייל'; return; }
      msg.style.color = 'var(--text-dim)'; msg.textContent = 'שולח...';
      try {
        const res = await fetch('/api/mailing-list/subscribe', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ name, email })
        });
        const data = await res.json();
        if (data.success) {
          msg.style.color = 'var(--green)'; msg.textContent = '✅ נרשמת בהצלחה!';
          setTimeout(closeSubscribeModal, 1800);
        } else {
          msg.style.color = 'var(--red)'; msg.textContent = data.error || 'שגיאה';
        }
      } catch(e) { msg.style.color = 'var(--red)'; msg.textContent = 'שגיאת תקשורת'; }
    }

  </script>
</body>
</html>
