<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>צילום תמונה לכניסה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#E8001C;--ink:#16181D;--muted:#5B6270;--line:#E3E5E9;--bg:#F4F5F7}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
main{max-width:460px;margin:0 auto;padding:24px 18px 40px;display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;line-height:1.3}
p{margin:0}.muted{color:var(--muted);font-size:14px}
ul{margin:0;padding-inline-start:20px;color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:700;min-height:52px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-size:17px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #C9CDD4}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid #1F6FEB;outline-offset:2px}
.preview{width:220px;height:220px;border-radius:50%;overflow:hidden;margin:0 auto;background:#E9EBEF;border:2px dashed #A9AFB9;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center}
.preview img{width:100%;height:100%;object-fit:cover}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;flex:none}
.err{color:#8F0A1A;font-weight:600;min-height:1.2em}
.ok{background:#E3F4EC;color:#0B5C3B;border-color:#B7E1CB;text-align:center}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true">G</span><strong id="gymName">Genesis Gym</strong></div>

  <section class="card" id="loading"><p class="muted">טוען…</p></section>

  <section class="card hidden" id="bad" role="alert"><h1>הקישור לא בתוקף</h1><p id="badText" class="muted"></p></section>

  <section class="card hidden" id="form">
    <h1 id="hello">צילום תמונה לכניסה</h1>
    <p class="muted">התמונה תשמש לפתיחת הדלת בזיהוי פנים. היא נשלחת ישירות לדלת ולא נשמרת אצלנו.</p>
    <ul><li>תאורה טובה, הפנים מול המצלמה</li><li>בלי משקפי שמש, כובע או מסכה</li><li>רק אתם בתמונה</li></ul>
    <div class="preview" id="preview">עדיין אין תמונה</div>
    <label class="btn ghost" style="position:relative">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="pickText">צילום תמונה</span>
      <input type="file" id="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer">
    </label>
    <label class="check"><input type="checkbox" id="consent"><span>אני מסכים/ה שחדר הכושר ישתמש בתמונת הפנים שלי לצורך כניסה.</span></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" id="send" disabled>שליחה</button>
  </section>

  <section class="card ok hidden" id="done" role="status">
    <h1>מוכן!</h1>
    <p id="doneText"></p>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
let blob = null;

function show(id) { ['loading', 'bad', 'form', 'done'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
function ready() { $('send').disabled = !(blob && $('consent').checked); }

(async () => {
  try {
    const r = await fetch('/api/gym/enroll/' + encodeURIComponent(token));
    const j = await r.json();
    if (!r.ok || !j.success) throw new Error(j.error || 'הקישור לא בתוקף');
    $('gymName').textContent = j.gymName;
    $('hello').textContent = `${j.firstName}, צילום תמונה לכניסה`;
    show('form');
  } catch (e) { $('badText').textContent = e.message; show('bad'); }
})();

// Shrink the photo before upload (phone photos are several MB).
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('לא ניתן לקרוא את התמונה'))), 'image/jpeg', 0.9);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error('לא ניתן לקרוא את התמונה'));
    img.src = URL.createObjectURL(file);
  });
}

$('file').addEventListener('change', async () => {
  const f = $('file').files[0]; if (!f) return;
  $('err').textContent = '';
  try {
    blob = await shrink(f);
    const img = document.createElement('img'); img.alt = 'התמונה שצילמת'; img.src = URL.createObjectURL(blob);
    $('preview').innerHTML = ''; $('preview').appendChild(img);
    $('pickText').textContent = 'צילום מחדש';
  } catch (e) { blob = null; $('err').textContent = e.message; }
  ready();
});
$('consent').addEventListener('change', ready);

$('send').addEventListener('click', async () => {
  const b = $('send'); b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span>שולח לדלת…';
  $('err').textContent = '';
  try {
    const fd = new FormData(); fd.append('photo', blob, 'selfie.jpg'); fd.append('consent', 'true');
    const r = await fetch('/api/gym/enroll/' + encodeURIComponent(token), { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || 'שגיאה. נסו שוב.');
    $('doneText').textContent = `${j.firstName}, התמונה נשלחה לדלת. מעכשיו הדלת תיפתח לך בזיהוי פנים.`;
    show('done');
  } catch (e) { $('err').textContent = e.message; b.textContent = 'שליחה'; ready(); }
});
</script>
</body>
</html>
