<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis Gym · ניהול חדר כושר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#E8001C;--ink:#16181D;--ink2:#3A404B;--muted:#5B6270;--line:#E3E5E9;--line2:#EEF0F3;--bg:#F4F5F7;--field:#C9CDD4}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--accent)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* layout */
.shell{display:flex;min-height:100vh}
.side{flex:0 0 232px;background:#fff;border-inline-end:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.brand strong{display:block;font-size:16px;line-height:1.25}.brand span{font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--ink2);border:none;background:none;cursor:pointer;text-align:right;width:100%;font-size:15px}
.nav[aria-current="page"]{background:var(--bg);font-weight:600;color:var(--ink)}
.nav:hover{background:var(--bg)}
.side .foot{margin-top:auto}
main{flex:1;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
header.top .t{flex:1 1 240px}
h1{margin:0;font-size:26px;font-weight:700;line-height:1.3}
h2{margin:0;font-size:18px;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile .k{color:var(--muted);font-size:14px}.tile .v{font-size:34px;font-weight:700;line-height:1.2}.tile .s{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
/* controls */
.btn{font-weight:600;height:44px;padding:0 18px;border-radius:8px;cursor:pointer;border:1px solid var(--field);background:#fff;color:var(--ink);font-size:14px;white-space:nowrap}
.btn.primary{border:none;background:var(--accent);color:#fff;font-size:15px}
.btn.dark{border:none;background:var(--ink);color:#fff}
.btn.danger{border-color:#F0B8BF;color:#8F0A1A}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid #1F6FEB;outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.in{height:44px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:#fff;color:var(--ink);font-size:15px}
textarea.in{height:auto;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;font-weight:600;height:44px;padding:0 16px;border-radius:999px;cursor:pointer;border:1px solid var(--field);background:#fff;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--field);border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:right}
th{padding:10px 8px;font-weight:500;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFBFC}
td .name{font-weight:500}
.badge{border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-block}
.b-active,.b-granted{background:#E3F4EC;color:#0B5C3B}.b-expiring{background:#FFF1D6;color:#7A4D00}
.b-frozen{background:#E8EEF8;color:#1F3F75}.b-expired,.b-denied{background:#FDE8EA;color:#8F0A1A}.b-unknown{background:#EEF0F3;color:#3A404B}
.cred{font-size:13px;margin-inline-end:10px}.cred.on{color:#0B5C3B;font-weight:600}.cred.off{color:#6B717C;text-decoration:line-through}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:14px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.note{background:#FFF1D6;color:#5C3A00;border:1px solid #F2D29B;border-radius:12px;padding:14px 18px;font-weight:500}
.note.info{background:#E8EEF8;color:#1F3F75;border-color:#C5D3EE}
.note.ok{background:#E3F4EC;color:#0B5C3B;border-color:#B7E1CB}
.err{color:#8F0A1A;font-size:14px;font-weight:500;min-height:1.2em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.kv .k{font-size:13px;color:var(--muted)}.kv .v{font-weight:600}
.photo{flex:0 0 112px;height:112px;border-radius:12px;background:#E9EBEF;border:1px dashed #A9AFB9;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--line2)}
.list-row:last-child{border-bottom:none}
.small{font-size:13px;color:var(--muted)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,19,24,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.two{display:flex;gap:12px}.two>*{flex:1}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.busy-bg{position:fixed;inset:0;background:rgba(17,19,24,.45);display:flex;align-items:center;justify-content:center;z-index:300}
.busy-card{background:#fff;border-radius:14px;padding:22px 26px;display:flex;align-items:center;gap:14px;min-width:280px;max-width:420px;box-shadow:0 10px 30px rgba(17,19,24,.25)}
.spin{width:28px;height:28px;border:3px solid #E3E5E9;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.busy-card .t{font-weight:600}.busy-card .s{font-size:13px;color:var(--muted)}
#toasts{position:fixed;bottom:24px;inset-inline-end:24px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(440px,calc(100vw - 48px))}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:500;box-shadow:0 6px 20px rgba(17,19,24,.18)}
@media (max-width:860px){.shell{flex-direction:column}.side{position:static;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{padding:0 8px}.side .foot{margin-top:0}main{padding:20px 16px}.nav{width:auto}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap hidden">
  <form class="login card" id="loginForm" novalidate>
    <div class="brand" style="padding:0"><span class="mark">G</span><div><strong>Genesis Gym</strong><span>ניהול כניסות לחדר כושר</span></div></div>
    <h1 style="font-size:22px">כניסה למערכת</h1>
    <label class="f">מספר טלפון<input class="in" id="lgPhone" type="tel" inputmode="tel" autocomplete="username" required></label>
    <label class="f">סיסמה<input class="in" id="lgPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn primary" type="submit" id="lgBtn">כניסה</button>
  </form>
</div>

<!-- APP -->
<div id="appView" class="shell hidden">
  <nav class="side" aria-label="ניווט ראשי">
    <div class="brand"><span class="mark">G</span><div><strong>Genesis Gym</strong><span id="gymName"></span></div></div>
    <button class="nav" data-go="dashboard"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>לוח בקרה</button>
    <button class="nav" data-go="members"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21c0-3-1.5-5-4-5.6"/></svg>מנויים</button>
    <button class="nav" data-go="guests"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M19 8v6M16 11h6"/></svg>אורחים</button>
    <button class="nav" data-go="plans"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>מסלולים</button>
    <button class="nav" data-go="log"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>יומן כניסות</button>
    <button class="nav" data-go="stats"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 16v-5M11 16V6M16 16v-8M21 16v-3"/></svg>סטטיסטיקה</button>
    <button class="nav" data-go="settings"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>הגדרות</button>
    <div class="foot"><button class="nav" id="logoutBtn">יציאה</button></div>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>

<div id="modalHost"></div>

<script>
'use strict';
// ---------- basics ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let TOKEN = null; try { TOKEN = localStorage.getItem('gymToken'); } catch (e) {}
let GYM = null;
const STATUS = { active: 'פעיל', expiring: 'פג בקרוב', frozen: 'מוקפא', expired: 'לא בתוקף' };
const METHOD = { face: 'פנים', card: 'כרטיס', pin: 'קוד', remote: 'פתיחה מרחוק', other: 'אחר' };
const RESULT = { granted: 'נכנס', denied: 'נדחה', unknown: 'לא ידוע' };
const DAYS = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];

async function api(path, opts = {}) {
  const o = { method: opts.method || 'GET', headers: { 'x-gym-token': TOKEN || '' } };
  if (opts.body instanceof FormData) o.body = opts.body;
  else if (opts.body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== '/api/gym/login') { logoutLocal(); throw new Error('נדרשת התחברות מחדש'); }
  if (!r.ok || j.success === false) { const e = new Error(j.error || 'שגיאה בשרת'); e.data = j; e.status = r.status; throw e; }
  return j;
}
// Blocking "working…" overlay for slow panel actions. Steps change the second line.
async function withBusy(title, fn, steps = []) {
  const bg = document.createElement('div'); bg.className = 'busy-bg';
  bg.innerHTML = `<div class="busy-card" role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><div><div class="t"></div><div class="s"></div></div></div>`;
  bg.querySelector('.t').textContent = title;
  const sub = bg.querySelector('.s'); let i = 0;
  const tick = () => { if (steps.length) sub.textContent = steps[Math.min(i++, steps.length - 1)]; };
  tick(); const timer = steps.length > 1 ? setInterval(tick, 3500) : null;
  document.body.appendChild(bg);
  try { return await fn(); } finally { if (timer) clearInterval(timer); bg.remove(); }
}
const PANEL_STEPS = ['מתחבר לפנל…', 'מעדכן את הפנל…', 'עוד רגע…'];
function toast(msg) {
  let host = document.getElementById('toasts');
  if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  while (host.children.length >= 3) host.firstElementChild.remove();
  host.appendChild(t); setTimeout(() => t.remove(), 4000);
}
const fmtDate = (s) => { if (!s) return '-'; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '-';
const fmtDT = (iso) => iso ? new Date(iso).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
const fmtPhone = (p) => { p = String(p || ''); return p.length === 10 ? `${p.slice(0, 3)}-${p.slice(3)}` : p; };
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem' }).format(new Date());
const daysTo = (s) => { if (!s) return null; return Math.round((new Date(s + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000); };
function statusBadge(m) {
  let t = STATUS[m.status] || m.status;
  if (m.status === 'expiring') { const n = daysTo(m.endDate); t = n === 0 ? 'פג היום' : `פג בעוד ${n} ימים`; }
  if (m.status === 'frozen' && m.frozenUntil) t = `מוקפא עד ${fmtDate(m.frozenUntil).slice(0, 5)}`;
  return `<span class="badge b-${m.status}">${esc(t)}</span>`;
}
function panelMsg(panel, okText) {
  if (!panel || panel.ok || !panel.results) return okText;
  const bad = panel.results.filter(r => !r.ok).map(r => r.error).filter(Boolean);
  return `${okText}. הפנל לא עודכן: ${bad[0] || panel.message}`;
}
const resultBadge = (r) => `<span class="badge b-${esc(r)}">${esc(RESULT[r] || r)}</span>`;
function creds(m) {
  const c = (on, l) => `<span class="cred ${on ? 'on' : 'off'}">${l}</span>`;
  return c(m.faceOnPanel, 'פנים') + c(!!m.card, 'כרטיס') + c(!!m.pin, 'קוד');
}
const telLink = (p) => p ? `<a href="tel:${esc(p)}" dir="ltr" style="text-decoration:underline">${esc(fmtPhone(p))}</a>` : '-';
function header(title, sub, right = '') {
  return `<header class="top"><div class="t"><h1>${esc(title)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${right}</header>`;
}

// ---------- modal ----------
function openModal(html, onMount) {
  const host = $('#modalHost');
  const prev = document.activeElement;
  host.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg = host.firstElementChild;
  const close = () => { host.innerHTML = ''; document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
  bg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  const first = bg.querySelector('input,select,textarea,button'); if (first) first.focus();
  if (onMount) onMount(bg, close);
  return close;
}
function confirmBox(text, okLabel = 'אישור', danger = false) {
  return new Promise(resolve => {
    openModal(`<h2>${esc(text)}</h2><div class="acts"><button class="btn" data-close>ביטול</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cfOk">${esc(okLabel)}</button></div>`,
      (bg, close) => { $('#cfOk', bg).addEventListener('click', () => { close(); resolve(true); }); bg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => resolve(false))); });
  });
}

// ---------- auth ----------
function showLogin() { $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); $('#lgPhone').focus(); }
function logoutLocal() { TOKEN = null; GYM = null; try { localStorage.removeItem('gymToken'); } catch (e) {} showLogin(); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#lgBtn'); $('#lgErr').textContent = ''; btn.disabled = true; btn.textContent = 'מתחבר…';
  try {
    const j = await api('/api/gym/login', { method: 'POST', body: { phone: $('#lgPhone').value, password: $('#lgPass').value } });
    TOKEN = j.token; try { localStorage.setItem('gymToken', TOKEN); } catch (e2) {}
    GYM = j.gym; startApp();
  } catch (err) { $('#lgErr').textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = 'כניסה'; }
});
$('#logoutBtn').addEventListener('click', async () => { try { await api('/api/gym/logout', { method: 'POST' }); } catch (e) {} logoutLocal(); });

function startApp() {
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  $('#gymName').textContent = GYM ? GYM.name : '';
  route();
}

// ---------- router ----------
document.querySelectorAll('.nav[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = '#' + b.dataset.go; }));
window.addEventListener('hashchange', route);
function setNav(key) { document.querySelectorAll('.nav[data-go]').forEach(b => b.dataset.go === key ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')); }
let routeRun = 0;
async function route() {
  if (!TOKEN) return showLogin();
  const [key, arg] = (location.hash || '#dashboard').slice(1).split('/');
  const run = ++routeRun;
  const main = $('#main');
  main.innerHTML = '<div class="empty">טוען…</div>';
  setNav(key === 'member' ? 'members' : key);
  const views = { guests: viewGuests, dashboard: viewDashboard, members: viewMembers, member: viewMember, plans: viewPlans, log: viewLog, stats: viewStats, settings: viewSettings };
  try { const html = await (views[key] || viewDashboard)(arg, run); if (run === routeRun && typeof html === 'string') main.innerHTML = html; }
  catch (e) { if (run === routeRun) main.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`; }
  if (run === routeRun && afterRender) { const f = afterRender; afterRender = null; f(); }
  main.focus && main.setAttribute('tabindex', '-1');
}
let afterRender = null;
const after = (f) => { afterRender = f; };

// ---------- DASHBOARD ----------
async function viewDashboard() {
  const j = await api('/api/gym/dashboard');
  const c = j.counts;
  const tile = (k, v, s) => `<div class="card tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const recent = j.recent.length ? `<div class="tw"><table style="min-width:520px"><thead><tr><th>שעה</th><th>מנוי</th><th>דלת</th><th>אמצעי</th><th>תוצאה</th></tr></thead><tbody>${j.recent.map(e => `<tr><td>${fmtDT(e.time)}</td><td class="name">${esc(e.name || 'לא מזוהה')}</td><td>${esc(e.door)}</td><td>${esc(METHOD[e.method] || e.method)}</td><td>${resultBadge(e.result)}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="empty">עדיין אין כניסות. לחצו "עדכון מהפנל" כדי למשוך את יומן הכניסות.</div>`;

  }

      <label class="f">מתאריך<input class="in" type="date" id="lgFrom" value="${logState.from}"></label>
      <label class="f">עד תאריך<input class="in" type="date" id="lgTo" value="${logState.to}"></label>
      <label class="f">תוצאה${sel('lgRes', logState.result, [['all', 'הכל'], ['granted', 'נכנס'], ['denied', 'נדחה']])}</label>
      <label class="f">אמצעי${sel('lgMet', logState.method, [['all', 'הכל'], ['face', 'פנים'], ['card', 'כרטיס'], ['pin', 'קוד'], ['remote', 'מרחוק']])}</label>
      <label class="f">דלת${sel('lgDoor', logState.door, [['all', 'כל הדלתות'], ...doors.map(d => [d.mac, esc(d.label)])])}</label>
      <label class="f" style="flex:1 1 200px">מנוי<input class="in" type="search" id="lgQ" placeholder="שם" value="${esc(logState.q)}"></label>
      <button class="btn" id="lgExport">ייצוא לאקסל</button></section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">${tot('רשומות', j.totals.attempts)}${tot('נכנסו', j.totals.granted)}${tot('נדחו', j.totals.denied)}${tot('שעת שיא', j.totals.peakHour || '-')}</div>
    <section class="card">${j.entries.length ? `<div class="tw"><table style="min-width:760px"><thead><tr><th>מועד</th><th>מנוי</th><th>מסלול</th><th>דלת</th><th>אמצעי</th><th>תוצאה</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">אין כניסות בטווח הזה. לחצו "עדכון מהפנל" כדי למשוך רשומות חדשות.</div>'}
    ${j.total > j.pageSize ? `<div class="pager"><span>עמוד ${j.page} מתוך ${pages}</span><span style="display:flex;gap:8px"><button class="btn" id="lgPrev" ${j.page <= 1 ? 'disabled' : ''}>הקודם</button><button class="btn" id="lgNext" ${j.page >= pages ? 'disabled' : ''}>הבא</button></span></div>` : ''}</section>`;
}
async function exportLog() {
  try {
    const r = await fetch('/api/gym/entries/export?' + new URLSearchParams({ from: logState.from, to: logState.to }), { headers: { 'x-gym-token': TOKEN } });
    if (!r.ok) throw new Error('הייצוא נכשל');
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href = url; a.download = `entries-${logState.from}-${logState.to}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { toast(e.message); }
}

// ---------- GUESTS ----------
const GUEST_ST = { active: ['פעיל', 'active'], active_used: ['פעיל · נכנס', 'active'], used: ['נוצל', 'frozen'], expired: ['פג', 'expired'], cancelled: ['בוטל', 'expired'] };
async function viewGuests() {
  const j = await api('/api/gym/guests');
  const rows = j.guests.map(g => {
    const [t, cls] = GUEST_ST[g.status] || [g.status, 'unknown'];
    const live = g.status === 'active' || g.status === 'active_used';
    return `<tr><td class="name">${esc(g.name)}</td><td style="white-space:nowrap">${telLink(g.phone)}</td><td>${fmtDate(g.date)}</td><td>${esc(g.start)}-${esc(g.end)}</td><td dir="ltr" style="text-align:right;font-weight:700;letter-spacing:2px">${live ? esc(g.pin) : '••••'}</td><td>${g.oneTime ? 'כניסה אחת' : 'ללא הגבלה'}</td><td><span class="badge b-${cls}">${t}</span></td>
      <td style="white-space:nowrap">${live ? `<button class="btn" data-wa="${g.id}">ווטסאפ</button> <button class="btn danger" data-cancel="${g.id}">ביטול</button>` : ''}</td></tr>`;
  }).join('');
  after(() => {
    $('#newGuest').addEventListener('click', guestFlow);
    document.querySelectorAll('[data-wa]').forEach(b => b.addEventListener('click', () => { const g = j.guests.find(x => x.id === b.dataset.wa); window.open(guestWaLink(g), '_blank', 'noopener'); }));
    document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async () => {
      const g = j.guests.find(x => x.id === b.dataset.cancel);
      if (!await confirmBox(`לבטל את הקוד של ${g.name}?`, 'ביטול קוד', true)) return;
      try { await withBusy('מבטל את הקוד', () => api('/api/gym/guests/' + g.id, { method: 'DELETE' }), PANEL_STEPS); toast('הקוד בוטל'); route(); } catch (e) { toast(e.message); }
    }));
  });
  return header('אורחים', 'קודי כניסה לאורחים ולאימון ניסיון, 30 הימים האחרונים', '<button class="btn primary" id="newGuest">כניסת אורח</button>')
    + `<section class="card">${j.guests.length ? `<div class="tw"><table style="min-width:820px"><thead><tr><th>שם</th><th>טלפון</th><th>תאריך</th><th>שעות</th><th>קוד</th><th>שימוש</th><th>סטטוס</th><th><span class="hidden">פעולות</span></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">עדיין אין אורחים. לחצו "כניסת אורח" כדי ליצור קוד.</div>'}</section>`;
}
function guestMsg(g, gymName) {
  return `שלום ${g.name}, קוד הכניסה שלך ל${gymName || (GYM && GYM.name) || 'חדר הכושר'}: ${g.pin}. תקף ב-${fmtDate(g.date)} בין ${g.start}-${g.end}${g.oneTime ? ', לכניסה אחת' : ''}.`;
}
function guestWaLink(g, gymName) {
  const p = String(g.phone || '').replace(/\D/g, '');
  const to = /^05\d{8}$/.test(p) ? '972' + p.slice(1) : '';
  return `https://wa.me/${to}?text=${encodeURIComponent(guestMsg(g, gymName))}`;
}
function guestFlow() {
  const now = new Date(); const hh = String(now.getHours()).padStart(2, '0');
  const endH = String(Math.min(23, now.getHours() + 4)).padStart(2, '0');
  openModal(`<h2>כניסת אורח</h2>
    <div class="two"><label class="f">שם האורח<input class="in" id="gsN" placeholder="למשל: דנה"></label><label class="f">טלפון נייד (לווטסאפ)<input class="in" id="gsP" type="tel" inputmode="tel" maxlength="12" placeholder="05X-XXXXXXX"></label></div>
    <label class="f">תאריך<input class="in" type="date" id="gsD" value="${todayISO()}" min="${todayISO()}"></label>
    <div class="two"><label class="f">משעה<input class="in" type="time" id="gsS" value="${hh}:00"></label><label class="f">עד שעה<input class="in" type="time" id="gsE" value="${endH}:${endH === '23' ? '59' : '00'}"></label></div>
    <label class="check" style="align-self:flex-start"><input type="checkbox" id="gsOne" checked>לכניסה אחת בלבד</label>
    <p class="small" style="margin:0">ייווצר קוד בן 4 ספרות בכל הדלתות, שעובד רק בשעות שנבחרו.</p>
    <div class="err" id="gsErr" role="alert"></div>
    <div class="acts"><button class="btn" data-close>ביטול</button><button class="btn primary" id="gsOk">יצירת קוד</button></div>`,
  (bg, close) => $('#gsOk', bg).addEventListener('click', async () => {
    const body = { name: $('#gsN', bg).value, phone: $('#gsP', bg).value.replace(/\D/g, ''), date: $('#gsD', bg).value, start: $('#gsS', bg).value, end: $('#gsE', bg).value, oneTime: $('#gsOne', bg).checked };
    if (!body.name.trim()) return ($('#gsErr', bg).textContent = 'חסר שם האורח');
    if (body.phone && !/^05\d{8}$/.test(body.phone)) return ($('#gsErr', bg).textContent = 'מספר טלפון לא תקין: נייד בן 10 ספרות שמתחיל ב-05');
    close();
    try {
      const r = await withBusy('יוצר קוד אורח', () => api('/api/gym/guests', { method: 'POST', body }), PANEL_STEPS);
      const g = { ...body, pin: r.pin };
      const bad = (r.results || []).filter(x => !x.ok);
      openModal(`<h2>הקוד של ${esc(g.name)}</h2>
        <div style="font-size:44px;font-weight:700;letter-spacing:10px;text-align:center" dir="ltr">${esc(r.pin)}</div>
        <p class="small" style="margin:0;text-align:center">${esc(fmtDate(g.date))} · ${esc(g.start)}-${esc(g.end)}${g.oneTime ? ' · כניסה אחת' : ''}</p>
        ${bad.length ? `<div class="note">הקוד לא נוצר בחלק מהדלתות: ${esc(bad.map(x => x.error).join(' · '))}</div>` : ''}
        <div class="acts"><button class="btn" data-close>סגירה</button><a class="btn primary" style="display:inline-flex;align-items:center" href="${esc(guestWaLink(g, r.gymName))}" target="_blank" rel="noopener">שליחה בווטסאפ</a></div>`,
        (bg2, close2) => bg2.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { if (location.hash === '#guests') route(); })));
      if (location.hash === '#guests') route();
    } catch (e) { toast(e.message); }
  }));
}

// ---------- STATS (placeholder) ----------
async function viewStats() {
  return header('סטטיסטיקה', '') + '<section class="card"><div class="empty">המסך הזה ייבנה בהמשך: שעות עומס, תפוסה, כניסות לפי מנוי.</div></section>';
}

// ---------- SETTINGS ----------
async function viewSettings() {
  const j = await api('/api/gym/actions');
  const doors = (GYM && GYM.panels) || [];
  after(() => $('#stDoorCheck').addEventListener('click', async () => {
    const b = $('#stDoorCheck'); b.disabled = true; b.textContent = 'בודק…';
    try { const r = await api('/api/gym/doors/status'); r.doors.forEach(d => { const el = document.querySelector(`[data-door="${d.mac}"]`); if (el) { el.textContent = d.online ? 'הפנל מחובר' : 'הפנל לא מחובר'; el.style.color = d.online ? '#0B5C3B' : '#8F0A1A'; } }); } catch (e) { toast(e.message); }
    b.disabled = false; b.textContent = 'בדיקת חיבור';
  }));
  return header('הגדרות', esc(GYM ? GYM.name : ''))
    + `<div class="row"><section class="card" style="flex:1 1 320px"><div class="sec-head"><h2>דלתות</h2><button class="btn" id="stDoorCheck">בדיקת חיבור</button></div>
      ${doors.map(d => `<div class="list-row"><div><div class="name">${esc(d.label)}</div><div class="small" dir="ltr" style="text-align:right">${esc(d.mac)}</div></div><div class="small" data-door="${esc(d.mac)}">לא נבדק</div></div>`).join('') || '<div class="small">לא הוגדרו דלתות.</div>'}
      <p class="small" style="margin:12px 0 0">הוספת דלת או שינוי סיסמה נעשים דרך תדור.</p></section>
      <section class="card" style="flex:2 1 420px;min-width:0"><h2 style="margin-bottom:8px">פעולות צוות אחרונות</h2>
      ${j.actions.length ? `<div class="tw"><table><thead><tr><th>מועד</th><th>פעולה</th><th>מי</th></tr></thead><tbody>${j.actions.slice(0, 30).map(a => `<tr><td>${fmtDT(a.at)}</td><td>${a.memberId ? `<a href="#member/${a.memberId}">${esc(ACTION[a.action] || a.action)}</a>` : esc(ACTION[a.action] || a.action)}</td><td>${esc(a.by || '')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">אין פעולות.</div>'}</section></div>`;
}

// ---------- boot ----------
(async () => {
  if (!TOKEN) return showLogin();
  try { GYM = (await api('/api/gym/me')).gym; startApp(); } catch (e) { showLogin(); }
})();
</script>
</body>
</html>
