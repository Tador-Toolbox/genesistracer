<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>מחירון תדאור</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pr:#ba0013;--prd:#8a000e;
  --sf:#f9f9f9;--sf-low:#f3f3f3;--sf-hi:#e8e8e8;--sf-hst:#e2e2e2;
  --on-sf:#1a1c1c;--on-sfv:#5d3f3c;
  --out:#926f6b;--outv:#e7bdb8;
  --inv-sf:#2f3131;--inv-on-sf:#f1f1f1;
  --font:'Hanken Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{font-family:var(--font);background:var(--sf);color:var(--on-sf);min-height:100vh;direction:rtl}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;user-select:none;vertical-align:middle}

/* TOP BAR */
.topbar{background:var(--pr);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.tb-inner{max-width:960px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb-logo-l{display:flex;align-items:center;min-width:36px}
.tb-logo-img{max-height:36px;max-width:120px;object-fit:contain;display:block}
.tb-right{text-align:right}
.tb-title{font-size:15px;font-weight:800;line-height:1.2}
.tb-sub{font-size:9px;opacity:.65;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tb-print{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;padding:6px 11px;border-radius:8px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.tb-print:hover{background:rgba(255,255,255,.12)}

/* CATEGORY TABS */
.cat-nav{background:#fff;border-bottom:2px solid var(--sf-hi);position:sticky;top:59px;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cat-nav-inner{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.cat-nav-inner::-webkit-scrollbar{display:none}
.cat-tab{padding:13px 20px;font-size:14px;font-weight:700;color:var(--on-sfv);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;flex-shrink:0;user-select:none}
.cat-tab:hover{color:var(--on-sf);background:var(--sf-low)}
.cat-tab.active{color:var(--pr);border-bottom-color:var(--pr)}

/* CONTENT */
.content{max-width:960px;margin:0 auto;padding:28px 20px 60px}

/* SECTION HEADER */
.sec-head{margin-bottom:22px;padding-bottom:14px;border-bottom:4px solid var(--pr);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec-title{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sec-sub{font-size:13px;color:var(--on-sfv);margin-top:4px}
.prod-count-badge{background:rgba(186,0,19,.09);color:var(--pr);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;flex-shrink:0;align-self:center}

/* PRODUCT GRID */
.pl-grid{display:grid;gap:14px}
.pl-card{border:1px solid var(--outv);border-radius:10px;overflow:hidden;background:#fff;transition:box-shadow .2s,transform .2s}
.pl-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
.pl-card-img{aspect-ratio:1;background:var(--sf-low);position:relative;overflow:hidden}
.pl-card-img a{cursor:pointer}
.pl-card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.pl-card:hover .pl-card-img img{transform:scale(1.04)}
.pl-sku{position:absolute;top:7px;right:7px;background:var(--pr);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:var(--mono)}
.no-img{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--outv)}
.no-img .ms{font-size:38px}
.pl-card-body{padding:11px 11px 13px}
.pl-card-price{font-size:18px;font-weight:800;color:var(--pr);font-family:var(--mono)}
.pl-card-name{font-size:13px;font-weight:700;line-height:1.3;margin:4px 0 3px;color:var(--on-sf)}
.pl-card-desc{font-size:11px;color:var(--on-sfv);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* NOTES */
.pl-notes{background:var(--inv-sf);color:var(--inv-on-sf);border-radius:10px;padding:16px;margin-top:24px;border-right:7px solid var(--pr)}
.pl-notes-t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#ffb4ab;margin-bottom:9px}
.pl-notes ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.pl-notes li{font-size:13px;display:flex;align-items:flex-start;gap:9px;opacity:.9}
.pl-notes li::before{content:'';width:6px;height:6px;border-radius:50%;background:#e31e24;flex-shrink:0;margin-top:5px}

/* FOOTER */
.pl-footer{background:#000;color:#fff;padding:26px 20px;text-align:center;margin-top:32px}
.pl-footer-brand{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.pl-footer-copy{font-size:10px;opacity:.4;font-weight:600}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--sf-hi) 25%,var(--sf-low) 50%,var(--sf-hi) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:6px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* EMPTY */
.empty{text-align:center;padding:70px 20px;color:var(--on-sfv)}
.empty .ms{font-size:52px;display:block;margin-bottom:14px;opacity:.25}
.empty h2{font-size:18px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13px}

/* MOBILE */
@media(max-width:600px){
  .sec-title{font-size:22px}
  .cat-tab{padding:11px 14px;font-size:13px}
  .pl-card-price{font-size:15px}
}

/* PRINT */
@media print{
  .cat-nav,.tb-print{display:none}
  .pl-card{break-inside:avoid}
  @page{size:A4;margin:15mm}
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--outv);border-radius:3px}
</style>
</head>
<body>

<!-- TOP BAR -->
<nav class="topbar" id="topbar" style="display:none">
  <div class="tb-inner">
    <div class="tb-logo-l" id="tb-logo"></div>
    <div class="tb-right">
      <div class="tb-title" id="tb-title"></div>
      <div class="tb-sub" id="tb-sub"></div>
    </div>
    <button class="tb-print" onclick="window.print()"><span class="ms">print</span> הדפסה</button>
  </div>
</nav>

<!-- CATEGORY TABS -->
<div class="cat-nav" id="cat-nav" style="display:none">
  <div class="cat-nav-inner" id="cat-tabs"></div>
</div>

<!-- SKELETON -->
<div class="content" id="skeleton">
  <div style="margin-bottom:22px">
    <div class="skel" style="height:32px;width:50%;margin-bottom:10px"></div>
    <div class="skel" style="height:14px;width:70%"></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
    <div class="skel" style="aspect-ratio:.75;border-radius:10px"></div>
    <div class="skel" style="aspect-ratio:.75;border-radius:10px"></div>
    <div class="skel" style="aspect-ratio:.75;border-radius:10px"></div>
    <div class="skel" style="aspect-ratio:.75;border-radius:10px"></div>
  </div>
</div>

<!-- REAL CONTENT -->
<div class="content" id="content" style="display:none">
  <div class="sec-head" id="sec-head">
    <div>
      <div class="sec-title" id="sec-title"></div>
      <div class="sec-sub" id="sec-sub"></div>
    </div>
    <span class="prod-count-badge" id="prod-count"></span>
  </div>
  <div class="pl-grid" id="pl-grid"></div>
  <div id="notes-section"></div>
</div>

<!-- FOOTER -->
<footer class="pl-footer" id="footer" style="display:none">
  <div class="pl-footer-brand" id="footer-brand"></div>
  <div class="pl-footer-copy" id="footer-copy"></div>
</footer>

<script>
let data={};
let activeCat=0;
const isMobile=window.innerWidth<=600;

async function init(){
  try{
    const r=await fetch('/api/pricelist');
    data=await r.json();
    buildTopbar();
    buildCatTabs();
    showCat(0);
    buildFooter();
    document.getElementById('skeleton').style.display='none';
    document.getElementById('content').style.display='block';
    document.title=(data.meta?.company||'TADOR SYSTEMS')+' — מחירון';
  }catch(e){
    document.getElementById('skeleton').innerHTML=`<div class="empty"><span class="ms">error_outline</span><h2>שגיאה בטעינת המחירון</h2><p>אנא נסה שוב מאוחר יותר</p></div>`;
  }
}

function buildTopbar(){
  const{meta={},logoUrl}=data;
  if(logoUrl) document.getElementById('tb-logo').innerHTML=`<img src="${logoUrl}" class="tb-logo-img" alt="לוגו"/>`;
  document.getElementById('tb-title').textContent=meta.year||'מחירון';
  document.getElementById('tb-sub').textContent=meta.company||'TADOR SYSTEMS';
  document.getElementById('topbar').style.display='block';
}

function buildCatTabs(){
  const cats=getCats();
  if(cats.length<=1){document.getElementById('cat-nav').style.display='none';return;}
  document.getElementById('cat-nav').style.display='block';
  const tabsEl=document.getElementById('cat-tabs');
  tabsEl.innerHTML=cats.map((c,i)=>
    `<div class="cat-tab${i===0?' active':''}" data-idx="${i}" onclick="showCat(${i})">${esc(c.name||'קטגוריה')}</div>`
  ).join('');
}

function showCat(idx){
  activeCat=idx;
  // update tab active
  document.querySelectorAll('.cat-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  const cats=getCats();
  const cat=cats[idx]||{name:'',subtitle:'',products:[]};
  const cols=isMobile?2:(data.cols||4);

  // Section header
  document.getElementById('sec-title').textContent=cat.name||'';
  document.getElementById('sec-sub').textContent=cat.subtitle||'';
  document.getElementById('sec-sub').style.display=cat.subtitle?'block':'none';
  const prods=cat.products||[];
  document.getElementById('prod-count').textContent=prods.length+' מוצרים';
  document.getElementById('prod-count').style.display=prods.length?'inline-flex':'none';

  // Grid
  const grid=document.getElementById('pl-grid');
  if(!prods.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><span class="ms">inventory_2</span><h2>אין מוצרים בקטגוריה זו</h2></div>`;
    grid.style.gridTemplateColumns='1fr';
  } else {
    grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    grid.innerHTML=prods.map(p=>`
      <div class="pl-card">
        <div class="pl-card-img">
          ${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener" style="display:block;position:absolute;inset:0;z-index:1" title="${esc(p.name)}"></a>` : ''}
          ${p.imgUrl?`<img src="${p.imgUrl}" alt="${esc(p.name)}" loading="lazy"/>`:`<div class="no-img"><span class="ms">image_not_supported</span></div>`}
          ${p.sku?`<span class="pl-sku" style="position:relative;z-index:2">${esc(p.sku)}</span>`:''}
          ${p.link?`<span style="position:absolute;bottom:7px;left:7px;z-index:2;background:rgba(0,0,0,.55);border-radius:99px;padding:3px 7px;display:inline-flex;align-items:center;gap:3px"><span class="ms" style="font-size:13px;color:#fff">open_in_new</span></span>`:''}
        </div>
        <div class="pl-card-body">
          ${p.price?`<div class="pl-card-price">₪${esc(p.price)}</div>`:''}
          <div class="pl-card-name">${esc(p.name||'')}</div>
          ${p.desc?`<div class="pl-card-desc">${esc(p.desc)}</div>`:''}
        </div>
      </div>`).join('');
  }

  // Notes (only on last/first cat or always — show on every cat)
  const notes=(data.notes||[]).filter(n=>n.trim());
  const notesEl=document.getElementById('notes-section');
  notesEl.innerHTML=notes.length?`<section class="pl-notes"><div class="pl-notes-t">הערות כלליות:</div><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></section>`:'';
}

function buildFooter(){
  const{meta={}}=data;
  document.getElementById('footer-brand').textContent=meta.company||'TADOR SYSTEMS';
  document.getElementById('footer-copy').textContent=`© ${new Date().getFullYear()} ${meta.footer||''}`;
  document.getElementById('footer').style.display='block';
}

function getCats(){
  if(data.categories&&data.categories.length) return data.categories;
  if(data.products&&data.products.length) return [{name:data.meta?.title||'מחירון',subtitle:data.meta?.subtitle||'',products:data.products}];
  return [];
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
</body>
</html>
