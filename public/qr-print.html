<!doctype html>
<html id="doc" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR — Tador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
          *{box-sizing:border-box}
          body{font-family:Arial,'Heebo',sans-serif;color:#111;margin:0;}
          .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:#fafafa;border-bottom:1px solid #eee;}
          .bar .seg{display:inline-flex;border:1px solid #e8001c;border-radius:8px;overflow:hidden;}
          .bar .seg button{border:none;background:#fff;color:#e8001c;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;}
          .bar .seg button.on{background:#e8001c;color:#fff;}
          .bar .prt{padding:8px 20px;font-size:14px;font-weight:700;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;}
          .page{padding:26px 28px;max-width:780px;margin:0 auto;}
          .p2{page-break-before:always;}
          h2{margin:0 0 4px;font-size:22px;}
          .addr{font-size:13px;color:#666;margin-bottom:16px;}
          .qrow{text-align:center;}
          .qc{border:1px solid #ddd;border-radius:12px;padding:16px 12px;width:300px;display:inline-block;vertical-align:top;margin:10px;text-align:center;}
          .qc .qt{font-size:17px;font-weight:800;}
          .qc .qs{font-size:12px;color:#666;min-height:15px;margin:2px 0 10px;}
          .qc img{width:240px;height:240px;border:1px solid #eee;border-radius:8px;padding:6px;}
          .qc .qe{font-size:11.5px;color:#555;line-height:1.4;margin-top:9px;text-align:start;}
          .qc .qlink{display:block;font-size:10px;color:#0369a1;word-break:break-all;margin-top:7px;direction:ltr;text-align:center;}
          .ghd{background:#e8001c;color:#fff;border-radius:12px;padding:11px 16px;text-align:center;margin-bottom:10px;}
          .ghd img{height:20px;width:auto;margin-bottom:6px;}
          .ghd h1{margin:0;font-size:18px;}
          .ghd p{margin:3px 0 0;font-size:11px;opacity:.9;}
          .gb{border:1px solid #e3e3e3;border-radius:10px;padding:9px 14px;margin-bottom:9px;}
          .gb h3{margin:0 0 7px;font-size:13.5px;}
          .gb h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e8001c;margin-inline-end:7px;vertical-align:middle;}
          .mrow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
          .mq{text-align:center;}
          .mq img{width:92px;height:92px;border:1px solid #eee;border-radius:8px;padding:4px;}
          .mq b{display:block;font-size:12px;margin-top:3px;}
          .mq small{color:#666;font-size:10px;}
          .st{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #eee;}
          .st:last-child{border-bottom:0;}
          .st .n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:#e8001c;color:#fff;font-weight:800;font-size:12px;text-align:center;line-height:21px;}
          .st b{font-size:12.5px;}
          .st p{margin:1px 0 0;font-size:11px;color:#555;line-height:1.35;}
          .foot{text-align:center;color:#888;font-size:10px;margin-top:7px;}
          .p3{page-break-before:always;}
          .ftbl{width:100%;border-collapse:collapse;margin-top:6px;}
          .ftbl th,.ftbl td{border:1px solid #ddd;padding:7px 10px;font-size:13px;text-align:center;}
          .ftbl th{background:#f4f6f8;color:#333;font-weight:800;}
          .ftbl .fn{text-align:start;font-weight:600;}
          .ftbl .fnum{font-weight:800;color:#e8001c;}
          .fsrc{font-size:11px;color:#666;text-align:start;margin:6px 2px 2px;}
          @media print{.noprint{display:none} .page{padding:12px 14px;}}
</style>
</head>
<body>
  <div class="bar noprint">
    <div class="seg"><button id="lhe" onclick="setLang('he')">עברית</button><button id="len" onclick="setLang('en')">English</button></div>
    <button class="prt" onclick="window.print()">🖨️</button>
  </div>
  <div id="root"><div class="page"><p style="text-align:center;color:#666;padding:40px;">מכין QR…</p></div></div>
  <script>
    var DATA = null, T = null, showBuilding = false, CUR = "he";
            function qr(d,s){return "https://api.qrserver.com/v1/create-qr-code/?size="+s+"x"+s+"&margin=8&data="+encodeURIComponent(d);}
            function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
            function sub(t,it){if(it.kind==="committee")return t.codeLbl+": "+it.code+" · "+t.pwLbl+": "+it.password;if(it.kind==="voipbell")return t.softphoneLbl+it.account;return it.addr;}
            function render(lang){
              var t=T[lang], d=DATA; CUR=lang;
              document.getElementById("doc").dir=t.dir;
              document.getElementById("lhe").className=(lang==="he"?"on":"");
              document.getElementById("len").className=(lang==="en"?"on":"");
              // Building QRs (resident registration + committee login) show only when the
              // manager enabled it for this panel (URL &building=1 → showBuilding).
              var hasVb=d.items.some(function(it){return it.kind==="voipbell";});
              var cards=d.items.filter(function(it){return it.kind==="voipbell"||showBuilding;}).map(function(it){
                var isHttp=/^https?:/i.test(it.data);
                return "<div class='qc'><div class='qt'>"+esc(t.titles[it.kind])+"</div><div class='qs'>"+esc(sub(t,it))+"</div><img src='"+qr(it.data,300)+"'><div class='qe'>"+esc(t.exp[it.kind])+"</div>"+(isHttp?"<a class='qlink' href='"+esc(it.data)+"'>"+esc(it.data)+"</a>":"")+"</div>";
              }).join("");
              // No VoIPBell account on this panel → say so instead of omitting it.
              if(!hasVb){ cards="<div class='qc'><div class='qt'>📞 VoIPBell</div><div class='qe' style='text-align:center;color:#999;margin-top:26px;'>"+esc(t.noVb)+"</div></div>"+cards; }
              var p2="";
              if(d.showGuide){
                var mini=function(arr,L,S){return arr.map(function(x,i){return "<div class='mq'><img src='"+qr(x.d,220)+"'><b>"+esc(L[i])+"</b><small>"+esc(S[i])+"</small></div>";}).join("");};
                var steps=t.steps.map(function(s,i){return "<div class='st'><span class='n'>"+(i+1)+"</span><div class='sb'><b>"+esc(s[0])+"</b><p>"+esc(s[1])+"</p></div></div>";}).join("");
                p2="<div class='page p2'><div class='ghd'><img src='"+d.logo+"' alt='Tador'><h1>"+esc(t.gHead)+"</h1><p>"+esc(t.gSub)+"</p></div>"
                  +"<div class='gb'><h3>"+esc(t.gDl)+"</h3><div class='mrow'>"+mini(d.dl,t.dlL,t.dlS)+"</div></div>"
                  +"<div class='gb'><h3>"+esc(t.gVid)+"</h3><div class='mrow'>"+mini(d.vid,t.vidL,t.vidS)+"</div></div>"
                  +"<div class='gb'><h3>"+esc(t.gSteps)+"</h3>"+steps+"</div>"
                  +"<div class='foot'>"+esc(t.foot)+"</div></div>";
              }
              var p3="";
              if(d.form && d.form.length){
                var frows=d.form.map(function(r){return "<tr><td class='fn'>"+esc(r.name)+"</td><td>"+esc(r.apt)+"</td><td class='fnum'>"+esc(r.num)+"</td></tr>";}).join("");
                var srcTxt = d.formSource==='panel' ? t.fSrcPanel : (d.formSource==='saved' ? t.fSrcSaved : '');
                p3="<div class='page p3'><div class='ghd'><img src='"+d.logo+"' alt='Tador'><h1>"+esc(t.formTitle)+"</h1><p>"+esc(t.formSub)+"</p></div>"
                  +(srcTxt ? "<div class='fsrc'>"+esc(srcTxt)+"</div>" : "")
                  +"<table class='ftbl'><thead><tr><th>"+esc(t.fName)+"</th><th>"+esc(t.fApt)+"</th><th>"+esc(t.fNum)+"</th></tr></thead><tbody>"+frows+"</tbody></table>"
                  +"<div class='foot'>"+esc(t.foot)+"</div></div>";
              }
              document.getElementById("root").innerHTML="<div class='page'><h2>"+esc(t.pageTitle)+" — "+esc(d.mac)+"</h2><div class='addr'>"+esc(d.addr)+"</div><div class='qrow'>"+cards+"</div></div>"+p2+p3;
              document.querySelector(".prt").textContent=t.print;
            }
            function setLang(l){render(l);}
    async function boot() {
      const qsp = new URLSearchParams(location.search);
      const MAC = (qsp.get('mac') || '').replace(/[:\s-]/g, '').toUpperCase();
      const ACCOUNT = (qsp.get('account') || '').trim();
      const ADDR = (qsp.get('addr') || '').trim();
      showBuilding = (qsp.get('building') === '1');   // manager-enabled per panel
      const BLD_BASE = 'https://genesistracer.onrender.com';
      const LOGO = location.origin + '/tador-logo-white.png';
      const items = [];
      // Page 1 barcodes — order: residents, committee (only if a building is linked), then VoIPBell.
      try {
        const bd = await fetch('/api/manager/building-by-mac/' + encodeURIComponent(MAC)).then(r => r.json());
        if (bd && bd.found && bd.building) {
          const b = bd.building;
          items.push({ kind: 'residents', title: '🏠 הרשמת דיירים', sub: b.address || '', exp: 'עמוד אישי לכל דייר להרשמה למערכת זיהוי הפנים: הדייר סורק, מזין פרטים, מעלה תמונת סלפי וממתין לאישור הוועד.', data: BLD_BASE + '/resident-register.html?code=' + b.buildingCode });
          items.push({ kind: 'committee', code: b.buildingCode, password: (b.password || ''), title: '👥 כניסת ועד', sub: 'קוד: ' + b.buildingCode + ' · סיסמה: ' + (b.password || ''), exp: 'פורטל ניהול דיירים: האחראי או הוועד מתחבר ומאשר את הדיירים, ולאחר מכן הם רשומים במערכת זיהוי הפנים.', data: BLD_BASE + '/committee.html?code=' + b.buildingCode });
        }
      } catch (e) {}
      if (ACCOUNT) {
        try {
          const q = await fetch('/api/manager/voipbell-qr?account=' + encodeURIComponent(ACCOUNT)).then(r => r.json());
          if (q && q.success) items.push({ kind: 'voipbell', account: ACCOUNT, title: '📞 VoIPBell', sub: 'הוספת סופטפון · ' + ACCOUNT, exp: 'ברקוד הבניין. לאחר הזנת מספר הדייר ומספר הטלפון — בחרו SCAN וסרקו את קוד ה‑QR.', data: q.payload });
        } catch (e) {}
      }

      // Resident setup form (last page): name + apartment + resident number (= SIP, 1001+).
      // Read the LIVE panel first (shows EVERYTHING on the panel — people + screens/IP rows);
      // fall back to the resident-tool saved list only if the panel is unreachable.
      // formSource records which one supplied the data, shown on the printed page.
      let formRows = [];
      let formSource = '';
      try {
        const pc = await fetch('/api/installer/panel-contacts?mac=' + encodeURIComponent(MAC)).then(r => r.json());
        if (pc && pc.success && (pc.contacts || []).length) {
          formRows = pc.contacts.slice()
            .sort((a, b) => String(a.sip_number).localeCompare(String(b.sip_number), undefined, { numeric: true }))
            .map(c => ({
              name: c.name || '',
              apt: c.call_number != null ? String(c.call_number) : '',
              num: c.sip_number != null ? String(c.sip_number) : ''
            }));
          formSource = 'panel';
        }
      } catch (e) {}
      if (!formRows.length) {
        try {
          const rr = await fetch('/api/installer/residents?mac=' + encodeURIComponent(MAC)).then(r => r.json());
          if (rr && rr.success && (rr.residents || []).length) {
            formRows = rr.residents.map(r => ({
              name: [r.firstName, r.lastName].filter(Boolean).join(' '),
              apt: r.apartment != null ? String(r.apartment) : '',
              num: r.sip != null ? String(r.sip) : ''
            }));
            formSource = 'saved';
          }
        } catch (e) {}
      }
      if (!items.length && !formRows.length) {
        document.getElementById('root').innerHTML = '<div class="page"><p style="text-align:center;color:#666;padding:40px;">אין QR להדפסה לפנל זה</p></div>';
        return;
      }
      const showGuide = !!ACCOUNT;
      DATA = {
        mac: MAC,
        addr: ADDR,
        showGuide: showGuide,
        form: formRows,
        formSource: formSource,
        items: items.map(it => ({
          kind: it.kind || '',
          data: it.data,
          code: it.code || '',
          password: it.password || '',
          account: it.account || '',
          addr: it.sub || ''
        })),
        dl: [
          { d: 'https://play.google.com/store/apps/details?id=net.voipbell' },
          { d: 'https://apps.apple.com/us/app/voip-bell/id1350362244' }
        ],
        vid: [
          { d: 'https://youtube.com/shorts/CIxXZXuutuQ' },
          { d: 'https://youtube.com/shorts/KBY2g6LDmvM' }
        ],
        logo: LOGO
      };
      T = {
        he: {
          dir: 'rtl', pageTitle: 'קודי QR', print: '🖨️ הדפס',
          codeLbl: 'קוד', pwLbl: 'סיסמה', softphoneLbl: 'הוספת סופטפון · ',
          titles: { residents: '🏠 הרשמת דיירים', committee: '👥 כניסת ועד', voipbell: '📞 VoIPBell' },
          exp: {
            residents: 'עמוד אישי לכל דייר להרשמה למערכת זיהוי הפנים: הדייר סורק, מזין פרטים, מעלה תמונת סלפי וממתין לאישור הוועד.',
            committee: 'פורטל ניהול דיירים: האחראי או הוועד מתחבר ומאשר את הדיירים, ולאחר מכן הם רשומים במערכת זיהוי הפנים.',
            voipbell: 'ברקוד הבניין. לאחר הזנת מספר הדייר ומספר הטלפון — בחרו SCAN וסרקו את קוד ה‑QR.'
          },
          gHead: 'הוספת חשבון VoIPBell', gSub: 'מדריך קצר להגדרת האפליקציה — לדייר',
          gDl: 'הורדת האפליקציה', gVid: 'סרטון הדרכה · דקה וחצי', gSteps: 'השלבים',
          foot: 'Tador Technologies · לתמיכה פנו למתקין',
          formTitle: 'טופס הגדרת דיירים — VoIPBell', formSub: 'מצאו את שמכם והזינו את "מספר דייר" בשדה Apartment number באפליקציה.',
          fName: 'שם דייר', fApt: 'מספר דירה', fNum: 'מספר דייר',
          fSrcPanel: 'מקור הנתונים: הנתונים נמשכו מהפנל ומעודכנים להיום', fSrcSaved: 'מקור הנתונים: גיבוי מהשרת',
          noVb: 'אין QR של חשבון VoIPBell לפנל זה', showBuilding: '🔑 הצג קודי בניין', hideBuilding: '🔑 הסתר קודי בניין',
          dlL: ['🤖 אנדרואיד', '🍎 iPhone'], dlS: ['Google Play', 'App Store'],
          vidL: ['🤖 אנדרואיד', '🍎 iPhone'], vidS: ['סרטון התקנה', 'סרטון התקנה'],
          steps: [
            ['התקנת האפליקציה', 'הורידו את אפליקציית VoIPBell מ‑App Store או Google Play, ופתחו אותה (אפשר לסרוק את הקודים למעלה).'],
            ['בחירת מצב חיוג', 'במסך Configuring account בחרו GROUP במצב החיוג (Call mode).'],
            ['מספר הדייר ומספר טלפון', 'בשדה Apartment number הקלידו את מספר הדייר (מרשימת אנשי הקשר — אינו מספר הדירה), ובשדה Phone number את מספר הטלפון.'],
            ['סריקת הברקוד', 'לחצו SCAN QR CODE וסרקו את ברקוד ה‑VoIPBell. (READ QR מתמונה שמורה · MANUAL בקוד שנשלח ללקוח.)'],
            ['רישום לשרת', 'בראש המסך לחצו על Registration failed (אדום) עד שישתנה ל‑Registered (ירוק) — האפליקציה רשומה לשרת.'],
            ['צפייה במצלמת הפנל', 'במסך הראשי לחצו על "דלת כניסה" כדי לצפות בשידור החי ממצלמת הפנל.'],
            ['פתיחת דלת / ניתוק', 'בשיחה: לחצן הדלת (מנעול ירוק) פותח את הדלת; לחצן הניתוק מסיים את השיחה מבלי לפתוח.']
          ]
        },
        en: {
          dir: 'ltr', pageTitle: 'QR Codes', print: '🖨️ Print',
          codeLbl: 'Code', pwLbl: 'Password', softphoneLbl: 'Add softphone · ',
          titles: { residents: '🏠 Resident registration', committee: '👥 Committee login', voipbell: '📞 VoIPBell' },
          exp: {
            residents: 'A personal page for every resident to register in the face-recognition system: the resident scans, enters their details, uploads a selfie and waits for committee approval.',
            committee: 'Resident-management portal: the building manager or committee logs in and approves residents, who are then enrolled in the face-recognition system.',
            voipbell: 'The building barcode. After entering the resident number and phone number — choose SCAN and scan the QR code.'
          },
          gHead: 'Add a VoIPBell account', gSub: 'A short guide to setting up the app — for the resident',
          gDl: 'Download the app', gVid: 'Setup video · 1.5 min', gSteps: 'Steps',
          foot: 'Tador Technologies · For support, contact your installer',
          formTitle: 'Resident Setup Form — VoIPBell', formSub: 'Find your name and enter the "Resident number" in the app\'s Apartment number field.',
          fName: 'Resident name', fApt: 'Apartment', fNum: 'Resident number',
          fSrcPanel: 'Data source: pulled from the panel, up to date as of today', fSrcSaved: 'Data source: server backup',
          noVb: 'No VoIPBell QR for this panel', showBuilding: '🔑 Show building codes', hideBuilding: '🔑 Hide building codes',
          dlL: ['🤖 Android', '🍎 iPhone'], dlS: ['Google Play', 'App Store'],
          vidL: ['🤖 Android', '🍎 iPhone'], vidS: ['Setup video', 'Setup video'],
          steps: [
            ['Install the app', 'Download the VoIPBell app from the App Store or Google Play and open it (you can scan the codes above).'],
            ['Choose the call mode', 'On the Configuring account screen, choose GROUP as the Call mode.'],
            ['Resident number & phone', 'In Apartment number enter the resident number (from the contacts list — it is not the apartment number), and in Phone number enter the phone number.'],
            ['Scan the barcode', 'Tap SCAN QR CODE and scan the VoIPBell barcode. (READ QR from a saved image · MANUAL for a code sent to the customer.)'],
            ['Register to the server', 'At the top of the screen tap Registration failed (red) until it turns to Registered (green) — the app is now registered to the server.'],
            ['View the panel camera', 'On the main screen tap "Front door" to view the live feed from the panel camera.'],
            ['Open door / hang up', 'During a call: the door button (green lock) opens the door; the hang-up button ends the call without opening.']
          ]
        }
      };
      render('he');
    }
    boot();
  </script>
</body>
</html>
