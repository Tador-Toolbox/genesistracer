<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הרשמת דיירים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
  :root{ --red:#e8001c; --ink:#17202a; --muted:#64717e; --line:#e6eaef; --bg:#f4f6f8; --card:#fff; --ok:#2e9e3f; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ink:#e8edf2; --muted:#9aa7b4; --line:#2b3440; --bg:#11161c; --card:#19212a; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif;line-height:1.5}
  .wrap{max-width:460px;margin:0 auto;padding:16px}
  header{background:var(--red);color:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  header .t{font-size:1.2rem;font-weight:800} header .s{font-size:.8rem;opacity:.92}
  header img{height:26px}
  .langseg{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:8px;overflow:hidden}
  .langseg button{border:none;background:transparent;color:#fff;padding:4px 10px;font:inherit;font-weight:700;font-size:.75rem;cursor:pointer}
  .langseg button.on{background:#fff;color:var(--red)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .addr{font-size:.9rem;color:var(--muted);margin-bottom:12px}
  label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 5px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;background:var(--card);color:var(--ink)}
  input:focus{outline:none;border-color:var(--red)}
  button.go{width:100%;margin-top:18px;padding:13px;border:none;border-radius:11px;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
  button.go:disabled{opacity:.6}
  .msg{margin-top:12px;font-size:.9rem;font-weight:600;min-height:1em}
  .msg.err{color:#d32f2f} .msg.ok{color:var(--ok)}
  .done{text-align:center;padding:10px 0}
  .done .big{font-size:2.4rem} .done p{margin:8px 0 0}
  .note{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.5}
  .link{background:none;border:none;color:var(--red);font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="t" data-i18n="title">הרשמת דיירים</div><div class="s" data-i18n="sub">הזנת פרטי דייר לאינטרקום הבניין</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="langseg"><button id="lhe" onclick="setLang('he')">עברית</button><button id="len" onclick="setLang('en')">English</button></div>
      <img src="/tador-logo-white.png" alt="Tador">
    </div>
  </header>

  <div class="card" id="formCard" style="display:none;">
    <div class="addr" id="addr"></div>
    <label for="apt" data-i18n="l_apt">מספר דירה</label>
    <input id="apt" inputmode="numeric" maxlength="20" autocomplete="off">
    <label for="first" data-i18n="l_first">שם פרטי</label>
    <input id="first" maxlength="60" autocomplete="given-name">
    <label for="last" data-i18n="l_last">שם משפחה</label>
    <input id="last" maxlength="60" autocomplete="family-name">
    <label for="phone" data-i18n="l_phone">מספר טלפון</label>
    <input id="phone" inputmode="tel" dir="ltr" maxlength="15" placeholder="05X-XXXXXXX" autocomplete="tel">
    <button class="go" id="goBtn" onclick="send()" data-i18n="send">שליחה</button>
    <div class="msg" id="msg"></div>
    <div class="note" data-i18n="note">הפרטים יישלחו לוועד הבית לאישור, ולאחר מכן יוזנו לאינטרקום של הבניין.</div>
  </div>

  <div class="card done" id="doneCard" style="display:none;">
    <div class="big">✅</div>
    <p><b data-i18n="done_t">הפרטים נשלחו בהצלחה</b></p>
    <p data-i18n="done_s">הבקשה ממתינה לאישור הוועד.</p>
    <button class="link" onclick="again()" data-i18n="again">➕ רישום דייר נוסף</button>
  </div>

  <div class="card" id="badCard" style="display:none;text-align:center;">
    <div style="font-size:2rem;">⚠️</div>
    <p data-i18n="bad">הקישור אינו תקין. בקשו מוועד הבית קישור חדש.</p>
  </div>
</div>

<script>
  const I18N = {
    he: { title:'הרשמת דיירים', sub:'הזנת פרטי דייר לאינטרקום הבניין', l_apt:'מספר דירה', l_first:'שם פרטי', l_last:'שם משפחה', l_phone:'מספר טלפון',
      send:'שליחה', sending:'שולח…', note:'הפרטים יישלחו לוועד הבית לאישור, ולאחר מכן יוזנו לאינטרקום של הבניין.',
      done_t:'הפרטים נשלחו בהצלחה', done_s:'הבקשה ממתינה לאישור הוועד.', again:'➕ רישום דייר נוסף',
      bad:'הקישור אינו תקין. בקשו מוועד הבית קישור חדש.', need:'נא למלא את כל השדות', badphone:'מספר טלפון לא תקין', net:'שגיאת תקשורת — נסו שוב', addr:a=>'🏢 '+a },
    en: { title:'Resident registration', sub:'Enter resident details for the building intercom', l_apt:'Apartment number', l_first:'First name', l_last:'Last name', l_phone:'Phone number',
      send:'Send', sending:'Sending…', note:'Your details are sent to the building committee for approval, then entered into the building intercom.',
      done_t:'Your details were sent', done_s:'The request is waiting for the committee\'s approval.', again:'➕ Register another resident',
      bad:'This link is not valid. Ask the building committee for a new link.', need:'Please fill in all fields', badphone:'Invalid phone number', net:'Network error — please try again', addr:a=>'🏢 '+a }
  };
  let LANG = 'he', ADDR = '';
  try { const l = localStorage.getItem('signupLang'); if (l === 'en' || l === 'he') LANG = l; } catch (e) {}
  const tr = () => I18N[LANG];
  const CODE = (new URLSearchParams(location.hash.replace(/^#/, '')).get('k') || new URLSearchParams(location.search).get('k') || '').trim().toUpperCase();

  function setLang(l){
    LANG = l; try { localStorage.setItem('signupLang', l); } catch (e) {}
    document.documentElement.lang = l; document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = tr()[el.getAttribute('data-i18n')]; if (typeof v === 'string') el.textContent = v; });
    document.getElementById('lhe').className = l === 'he' ? 'on' : ''; document.getElementById('len').className = l === 'en' ? 'on' : '';
    document.getElementById('addr').textContent = ADDR ? tr().addr(ADDR) : '';
    document.title = tr().title;
  }
  function msg(t, ok){ const m = document.getElementById('msg'); m.textContent = t || ''; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

  async function init(){
    setLang(LANG);
    if (!CODE) { document.getElementById('badCard').style.display = 'block'; return; }
    try {
      const d = await fetch('/api/residents/signup-info?code=' + encodeURIComponent(CODE)).then(r => r.json());
      if (!d.success) { document.getElementById('badCard').style.display = 'block'; return; }
      ADDR = d.address || ''; setLang(LANG);
      document.getElementById('formCard').style.display = 'block';
      document.getElementById('apt').focus();
    } catch (e) { document.getElementById('badCard').style.display = 'block'; }
  }
  async function send(){
    const v = id => document.getElementById(id).value.trim();
    const body = { code: CODE, apartment: v('apt'), firstName: v('first'), lastName: v('last'), phone: v('phone') };
    if (!body.apartment || !body.firstName || !body.lastName || !body.phone) { msg(tr().need); return; }
    if (body.phone.replace(/\D/g, '').length < 9) { msg(tr().badphone); return; }
    const btn = document.getElementById('goBtn'); btn.disabled = true; msg(tr().sending, true);
    try {
      const d = await fetch('/api/residents/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
      if (!d.success) { msg(d.error || tr().net); }
      else { document.getElementById('formCard').style.display = 'none'; document.getElementById('doneCard').style.display = 'block'; }
    } catch (e) { msg(tr().net); }
    btn.disabled = false;
  }
  function again(){
    ['apt','first','last','phone'].forEach(id => document.getElementById(id).value = '');
    msg('');
    document.getElementById('doneCard').style.display = 'none'; document.getElementById('formCard').style.display = 'block';
    document.getElementById('apt').focus();
  }
  init();
</script>
</body>
</html>
