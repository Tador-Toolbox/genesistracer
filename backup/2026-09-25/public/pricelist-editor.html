<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>עורך מחירון – GenesisTracer</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pr:#ba0013;--prd:#8a000e;--on-pr:#fff;
  --sf:#f9f9f9;--sf-low:#f3f3f3;--sf-hi:#e8e8e8;--sf-hst:#e2e2e2;
  --sf-w:#fff;--on-sf:#1a1c1c;--on-sfv:#5d3f3c;
  --out:#926f6b;--outv:#e7bdb8;
  --inv-sf:#2f3131;--inv-on-sf:#f1f1f1;--err:#ba1a1a;
  --font:'Hanken Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--rl:12px;
}
body{font-family:var(--font);background:var(--sf);color:var(--on-sf);min-height:100vh;direction:rtl}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}
.tb{background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:100}
.tb h1{font-size:17px;font-weight:800}
.tb-brand{font-size:10px;font-weight:700;opacity:.6;letter-spacing:.07em;text-transform:uppercase}
.tb-acts{display:flex;gap:8px}
.ws{display:grid;grid-template-columns:560px 1fr;overflow:hidden}

/* EDITOR */
.ed{background:var(--sf-w);border-left:1px solid var(--outv);display:flex;flex-direction:column;overflow:hidden}
.ed-head{padding:12px 18px;border-bottom:1px solid var(--outv);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ed-head h2{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-sfv)}
.ed-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:13px}
.sc{background:var(--sf-low);border:1px solid var(--outv);border-radius:var(--rl);padding:14px;display:flex;flex-direction:column;gap:10px}
.sc-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--out)}
lbl,label{font-size:11px;font-weight:600;color:var(--on-sfv);display:block;margin-bottom:3px}
input[type=text],input[type=number],textarea,select{width:100%;padding:7px 10px;font-family:var(--font);font-size:13px;border:1.5px solid var(--outv);border-radius:var(--r);background:#fff;color:var(--on-sf);outline:none;transition:border-color .15s;direction:rtl}
input:focus,textarea:focus,select:focus{border-color:var(--pr)}
textarea{resize:vertical;min-height:52px}

/* CATEGORY TABS IN EDITOR */
.cat-tabs{display:flex;flex-direction:column;gap:6px}
.cat-tab-item{background:#fff;border:1.5px solid var(--outv);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.cat-tab-item.active{border-color:var(--pr);box-shadow:0 0 0 2px rgba(186,0,19,.12)}
.cat-tab-item:hover{border-color:var(--pr)}
.cat-tab-header{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sf-low);cursor:pointer;user-select:none}
.cat-tab-header .cat-drag{color:var(--out);font-size:18px;cursor:grab}
.cat-tab-header .cat-name{flex:1;font-size:13px;font-weight:700}
.cat-tab-header .cat-count{font-size:11px;color:var(--out);font-weight:600}
.cat-tab-header .cat-acts{display:flex;gap:3px}
.cat-tab-body{padding:12px;display:none;border-top:1px solid var(--outv);flex-direction:column;gap:8px}
.cat-tab-body.open{display:flex}

/* PRODUCT LIST */
.prod-list{display:flex;flex-direction:column;gap:6px}
.pie{background:#fff;border:1.5px solid var(--outv);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.pie:hover{border-color:var(--pr)}
.pih{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;background:var(--sf-low)}
.pth{width:32px;height:32px;border-radius:5px;background:var(--sf-hst);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pth img{width:100%;height:100%;object-fit:cover}
.pih .info{flex:1;min-width:0}
.pih .iname{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pih .iprice{font-size:11px;color:var(--pr);font-weight:700;font-family:var(--mono)}
.pih .acts{display:flex;gap:3px;flex-shrink:0}
.pib{padding:11px;display:none;border-top:1px solid var(--outv);flex-direction:column;gap:9px}
.pib.open{display:flex}
.img-zone{border:2px dashed var(--outv);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:#fff;position:relative}
.img-zone:hover{border-color:var(--pr);background:var(--sf-low)}
.img-zone.has-img:hover .img-del-overlay{display:flex}
.img-del-overlay{display:none;position:absolute;inset:0;background:rgba(186,0,19,.75);align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;color:#fff;font-family:var(--font);font-size:12px;font-weight:700;z-index:2}
.img-del-overlay .ms{font-size:28px}
.img-zone .prev{max-height:90px;object-fit:contain;border-radius:4px;display:block;margin:0 auto 5px}
.img-zone .zlb{font-size:11px;color:var(--out);font-weight:600}
.img-zone .zico{font-size:22px;color:var(--outv);display:block;margin-bottom:3px}
.upbadge{position:absolute;top:5px;left:5px;background:var(--pr);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:99px;display:none}
.img-zone.uploading .upbadge{display:block}

/* LOGO ZONE */
.logo-zone{border:2px dashed var(--outv);border-radius:var(--r);padding:10px 13px;cursor:pointer;background:#fff;display:flex;align-items:center;gap:10px;min-height:54px;transition:border-color .15s}
.logo-zone:hover{border-color:var(--pr);background:var(--sf-low)}
.logo-prev{max-height:38px;max-width:110px;object-fit:contain}
.logo-ph{display:flex;align-items:center;gap:7px;color:var(--out)}
.logo-ph span{font-size:11px;font-weight:600}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-family:var(--font);font-size:12px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.btn-pr{background:var(--pr);color:#fff}.btn-pr:hover{background:var(--prd)}
.btn-w{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}.btn-w:hover{background:rgba(255,255,255,.1)}
.btn-gh{background:transparent;color:var(--on-sf);border:1.5px solid var(--outv)}.btn-gh:hover{border-color:var(--on-sf);background:var(--sf-low)}
.btn-ic{padding:5px;border-radius:6px;background:transparent;border:none;cursor:pointer;color:var(--out);display:inline-flex;align-items:center;transition:all .15s}
.btn-ic:hover{background:var(--sf-hi);color:var(--on-sf)}
.btn-ic.d:hover{background:#ffdad6;color:var(--err)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border:2px dashed var(--outv);border-radius:var(--r);background:transparent;font-family:var(--font);font-size:12px;font-weight:700;color:var(--out);cursor:pointer;transition:all .15s;width:100%}
.add-btn:hover{border-color:var(--pr);color:var(--pr);background:rgba(186,0,19,.04)}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;user-select:none;vertical-align:middle}

/* PREVIEW */
.pv-panel{background:var(--sf);overflow-y:auto;display:flex;flex-direction:column}
.pv-tb{background:#fff;border-bottom:1px solid var(--outv);padding:8px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;flex-shrink:0}
.tlbl{font-size:11px;font-weight:700;color:var(--on-sfv);text-transform:uppercase;letter-spacing:.05em}
.vp-tog{display:flex;border:1.5px solid var(--outv);border-radius:var(--r);overflow:hidden}
.vp-tog button{padding:4px 9px;font-size:11px;font-weight:600;background:transparent;border:none;cursor:pointer;color:var(--out);font-family:var(--font);transition:all .15s}
.vp-tog button.active{background:var(--pr);color:#fff}
.pv-stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px}
.pv-frame{background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.12);transition:width .3s;width:100%;max-width:820px}
.pv-frame.mob{width:390px}

/* PRICELIST SHARED */
.pl-top{background:var(--pr);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.pl-logo-l{display:flex;align-items:center;min-width:36px}
.pl-logo-img{max-height:52px;max-width:160px;object-fit:contain}
.pl-top-r{text-align:right}
.pl-top-title{font-size:22px;font-weight:800;line-height:1.2}
.pl-top-sub{font-size:13px;opacity:.8;font-weight:700;letter-spacing:.02em}
/* CATEGORY TABS */
.pl-cats{background:#fff;border-bottom:2px solid var(--sf-hi);display:flex;align-items:stretch;gap:0}
.pl-cats-inner{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}.pl-cats-inner::-webkit-scrollbar{display:none}
.pl-cat-arrow{background:#fff;border:none;padding:0 8px;cursor:pointer;font-family:"Material Symbols Outlined";font-size:18px;line-height:1;flex-shrink:0;border-left:1px solid var(--sf-hi);color:var(--on-sfv);display:flex;align-items:center}
.pl-cat-arrow:first-child{border-left:none;border-right:1px solid var(--sf-hi)}
.pl-cat-arrow:hover{background:var(--sf-low);color:var(--pr)}

.pl-cat-tab{padding:10px 18px;font-size:13px;font-weight:700;color:var(--on-sfv);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.pl-cat-tab:hover{color:var(--on-sf);background:var(--sf-low)}
.pl-cat-tab.active{color:var(--pr);border-bottom-color:var(--pr)}
.pl-main{padding:20px 18px}
.pl-sec-head{border-bottom:4px solid var(--pr);padding-bottom:10px;margin-bottom:16px}
.pl-sec-title{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pl-sec-sub{font-size:12px;color:var(--on-sfv);margin-top:3px}
.pl-grid{display:grid;gap:11px}
.pl-card{border:1px solid var(--outv);border-radius:8px;overflow:hidden;background:#fff;transition:box-shadow .2s,border-color .2s;cursor:pointer}
.pl-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);border-color:var(--pr)}.pl-card:hover::after{content:"✏ לחץ לעריכה";position:absolute;bottom:0;left:0;right:0;background:rgba(186,0,19,.85);color:#fff;font-size:11px;font-weight:700;padding:5px;text-align:center;font-family:var(--font)}.pl-card{position:relative}
.pl-card-img{aspect-ratio:1;background:var(--sf-low);position:relative;overflow:hidden}
.pl-card-img img{width:100%;height:100%;object-fit:cover;display:block}
.pl-sku{position:absolute;top:6px;right:6px;background:var(--pr);color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;font-family:var(--mono)}
.no-img{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--outv)}
.no-img .ms{font-size:32px}
.pl-card-body{padding:9px 9px 11px}
.pl-card-price{font-size:18px;font-weight:800;color:var(--pr);font-family:var(--mono)}
.pl-card-name{font-size:13px;font-weight:700;line-height:1.3;margin:4px 0 3px;color:var(--on-sf);word-break:break-word}
.pl-card-desc{font-size:12px;color:var(--on-sfv);line-height:1.4;white-space:pre-wrap;word-break:break-word}
.pl-empty-card{border:1px solid var(--outv);border-radius:8px;background:var(--sf-low);opacity:.2;aspect-ratio:.75}
.pl-notes{background:var(--inv-sf);color:var(--inv-on-sf);border-radius:8px;padding:14px;margin-top:16px;border-right:6px solid var(--pr)}
.pl-notes-t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#ffb4ab;margin-bottom:7px}
.pl-notes ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.pl-notes li{font-size:11px;display:flex;align-items:flex-start;gap:7px;opacity:.9}
.pl-notes li::before{content:'';width:5px;height:5px;border-radius:50%;background:#e31e24;flex-shrink:0;margin-top:5px}
.pl-footer{background:#000;color:#fff;padding:20px;text-align:center}
.pl-footer-brand{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.pl-footer-copy{font-size:9px;opacity:.45;font-weight:600}

/* MISC */
.note-row{display:flex;align-items:center;gap:7px}
.note-row input{flex:1}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;background:var(--sf-hi);color:var(--on-sfv)}
.chip.red{background:rgba(186,0,19,.1);color:var(--pr)}
.chip.green{background:rgba(0,150,100,.1);color:#007c50}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--inv-sf);color:var(--inv-on-sf);padding:8px 16px;border-radius:99px;font-size:12px;font-weight:600;pointer-events:none;transition:transform .25s,opacity .25s;opacity:0;z-index:9999}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.save-st{font-size:11px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:.03em}
.save-st.ok{color:#7effcc}

/* DRAG & DROP */
.drag-over{background:rgba(186,0,19,.06)!important;border-color:var(--pr)!important}
.dragging{opacity:.4;border:2px dashed var(--pr)!important}
.cat-tab-item{cursor:default}
.cat-drag,.prod-drag{cursor:grab;touch-action:none}
.cat-drag:active,.prod-drag:active{cursor:grabbing}
#cat-list-wrap::-webkit-scrollbar{width:4px}#cat-list-wrap::-webkit-scrollbar-thumb{background:var(--outv);border-radius:3px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--outv);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <header class="tb">
    <div style="display:flex;align-items:center;gap:13px">
      <div class="tb-brand">GenesisTracer</div>
      <div style="width:1px;height:17px;background:rgba(255,255,255,.2)"></div>
      <h1>עורך מחירון</h1>
    </div>
    <div style="display:flex;align-items:center;gap:9px">
      <span class="save-st" id="save-st">טוען...</span>
      <button class="btn btn-w" id="undo-btn" onclick="undo()" disabled title="בטל פעולה אחרונה"><span class="ms">undo</span></button><button class="btn btn-w" onclick="saveAll()"><span class="ms">save</span> שמור הכל</button>
      <a class="btn btn-w" href="/pricelist.html" target="_blank"><span class="ms">open_in_new</span> תצוגת לקוח</a>
      <button class="btn btn-w" onclick="logout()"><span class="ms">logout</span> יציאה</button><a class="btn btn-w" href="/manager.html"><span class="ms">arrow_back</span> חזרה</a>
    </div>
  </header>

  <div class="ws">
    <!-- EDITOR -->
    <aside class="ed">
      <div class="ed-head">
        <h2>הגדרות מחירון</h2>
        <span class="chip red" id="total-chip">0 מוצרים</span>
      </div>
      <div class="ed-body" id="ed-body">

        <!-- Meta -->
        <div class="sc">
          <div class="sc-t">פרטי מחירון</div>
          <div><label>שם חברה</label><input type="text" id="meta-company" oninput="rp()" placeholder="TADOR SYSTEMS"/></div>
          <div><label>שנה / תקופה</label><input type="text" id="meta-year" oninput="rp()" placeholder="מחירון רשמי 2026"/></div>
          <div><label>טקסט פוטר</label><input type="text" id="meta-footer" oninput="rp()" placeholder="כל המחירים אינם כוללים מע״מ"/></div>
          <div>
            <label>לוגו (פינה שמאלית עליונה)</label>
            <div class="logo-zone" onclick="document.getElementById('logo-inp').click()">
              <input type="file" id="logo-inp" accept="image/*" style="display:none" onchange="uploadLogo(event)"/>
              <div id="logo-pw"><div class="logo-ph"><span class="ms">add_photo_alternate</span><span>לחץ להעלאת לוגו</span></div></div>
              <div id="logo-rw" style="display:none;margin-right:auto"><button class="btn-ic d" onclick="deleteLogo(event)"><span class="ms">delete</span></button></div>
            </div>
          </div>
        </div>

        <!-- Categories -->
        <div class="sc" style="gap:0;padding-bottom:0">
          <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px">
            <div class="sc-t" style="margin:0">קטגוריות ומוצרים</div>
            <div style="display:flex;gap:4px">
              <button class="btn-ic" onclick="scrollCatList(-120)" title="גלול למעלה"><span class="ms">arrow_upward</span></button>
              <button class="btn-ic" onclick="scrollCatList(120)" title="גלול למטה"><span class="ms">arrow_downward</span></button>
            </div>
          </div>
          <div id="cat-list-wrap" style="max-height:600px;overflow-y:auto;scroll-behavior:smooth;">
            <div class="cat-tabs" id="cat-list"></div>
          </div>
        </div>

        <!-- Add category — separated -->
        <button class="add-btn" onclick="addCat()"><span class="ms" style="font-size:15px">add_circle</span> הוסף קטגוריה</button>

        <!-- Notes -->
        <div class="sc">
          <div class="sc-t">הערות כלליות</div>
          <div id="notes-list" style="display:flex;flex-direction:column;gap:5px"></div>
          <button class="add-btn" style="margin-top:3px" onclick="addNote()"><span class="ms" style="font-size:15px">add</span> הוסף הערה</button>
        </div>

        <!-- Cols -->
        <div class="sc" style="flex-direction:row;align-items:center;justify-content:space-between">
          <div class="sc-t" style="margin:0">עמודות בתצוגה</div>
          <select id="cols-sel" onchange="rp()" style="width:auto;padding:5px 10px;font-size:12px">
            <option value="2">2 עמודות</option>
            <option value="3">3 עמודות</option>
            <option value="4" selected>4 עמודות</option>
          </select>
        </div>

      </div>
    </aside>

    <!-- PREVIEW -->
    <main class="pv-panel">
      <div class="pv-tb">
        <span class="tlbl">תצוגה מקדימה</span>
        <div class="vp-tog">
          <button class="active" onclick="setVP('d',this)"><span class="ms" style="font-size:13px">desktop_windows</span></button>
          <button onclick="setVP('m',this)"><span class="ms" style="font-size:13px">smartphone</span></button>
        </div>
        <div style="flex:1"></div>
        <span class="chip green" id="saved-chip" style="display:none">נשמר ✓</span>
      </div>
      <div class="pv-stage">
        <div class="pv-frame" id="pv-frame">
          <div id="pl-render"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── AUTH: prompt on load, store in memory only ──
let AUTH={username:'',password:''};

function promptLogin(){
  const u=sessionStorage.getItem('pl_user');
  const p=sessionStorage.getItem('pl_pass');
  if(u&&p){AUTH.username=u;AUTH.password=p;return;}
  // לא מחובר — חזרה לעמוד הלוגין
  window.location.href='/pricelist-login.html';
}

function logout(){sessionStorage.removeItem('pl_user');sessionStorage.removeItem('pl_pass');window.location.href='/pricelist-login.html';}
function authBody(extra){return JSON.stringify({...extra,username:AUTH.username,password:AUTH.password});}
function authFD(fd){fd.append('username',AUTH.username);fd.append('password',AUTH.password);return fd;}
let isMob=false;
let previewCatIdx=0;

let S={
  meta:{company:'TADOR SYSTEMS',year:'מחירון רשמי 2026',footer:'כל המחירים אינם כוללים מע״מ'},
  logoUrl:null,
  categories:[],
  notes:[],
  cols:4
};

function makeCat(name){return{id:'c'+Date.now()+Math.random().toString(36).slice(2),name:name||'',subtitle:'',products:[],open:true};}
function makeProd(n){return{id:'p'+Date.now()+Math.random().toString(36).slice(2),name:'',sku:'',price:'',currency:'ils',desc:'',link:'',youtubeUrl:'',imgUrl:null,images:[],hidden:false,order:n||0,open:false};}
// Currency symbol helper — defaults to shekel for products saved before this field existed
function curSym(p){return (p&&p.currency==='usd')?'$':'₪';}

window.onload=async()=>{promptLogin();await load();syncUI();renderCats();rp();saveHistory();};

async function load(){
  try{
    const r=await fetch('/api/pricelist');
    const d=await r.json();
    if(d.meta) S.meta={...S.meta,...d.meta};
    if(d.logoUrl) S.logoUrl=d.logoUrl;
    if(d.categories&&d.categories.length) S.categories=d.categories;
    else if(d.products&&d.products.length){
      S.categories=[{...makeCat('כללי'),products:d.products}];
    }
    if(d.notes) S.notes=d.notes;
    if(d.cols) S.cols=d.cols;
    setSS('נטען','ok');
  }catch(e){setSS('שגיאה בטעינה','');}
}

function syncUI(){
  sv('meta-company',S.meta.company);sv('meta-year',S.meta.year);sv('meta-footer',S.meta.footer);
  document.getElementById('cols-sel').value=S.cols||4;
  updateLogoUI();syncNotes();
}
function rm(){
  S.meta.company=gv('meta-company');S.meta.year=gv('meta-year');S.meta.footer=gv('meta-footer');
  S.cols=parseInt(document.getElementById('cols-sel').value)||4;
}

async function saveAll(){
  rm();setSS('שומר...','');
  try{
    const cats=S.categories.map(c=>({...c,products:c.products.map(p=>({...p,imgDataUrl:undefined}))}));
    const saveRes=await fetch('/api/pricelist/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:authBody({meta:S.meta,notes:S.notes,cols:S.cols,categories:cats})});
    if(saveRes.status===401){sessionStorage.clear();window.location.href='/pricelist-login.html';throw new Error('401');}
    if(!saveRes.ok) throw new Error('save failed');
    setSS('נשמר ✓','ok');document.getElementById('saved-chip').style.display='inline-flex';
    showToast('המחירון נשמר ✓');
  }catch(e){
    if(e.message&&e.message.includes('401')){sessionStorage.clear();window.location.href='/pricelist-login.html';}
    else{setSS('שגיאה','');showToast('שגיאה בשמירה ✗');}

/* NOTES */

function addNote(){S.notes.push('');syncNotes();rp();}
function rmNote(i){S.notes.splice(i,1);syncNotes();rp();}

/* CATEGORIES */
function renderCats(){
  const l=document.getElementById('cat-list');l.innerHTML='';
  let total=0;
  S.categories.forEach((cat,ci)=>{
    total+=cat.products.length;
    const el=document.createElement('div');el.className='cat-tab-item'+(ci===previewCatIdx?' active':'');el.id='cat-'+cat.id;el.setAttribute('draggable','true');el.dataset.ci=ci;
    el.innerHTML=`
      <div class="cat-tab-header" onclick="selectCat(${ci});toggleCatBody(${ci})">
        <span class="ms cat-drag" onclick="event.stopPropagation()">drag_indicator</span>
        <span class="cat-name">${esc(cat.name)||'קטגוריה ללא שם'}</span>
        <span class="cat-count">${cat.products.length} מוצרים</span>
        <div class="cat-acts" onclick="event.stopPropagation()">
          <button class="btn-ic d" title="מחק" onclick="rmCat(${ci})"><span class="ms">delete</span></button>
        </div>
        <span class="ms" style="color:var(--out);font-size:18px;flex-shrink:0">${cat.open?'expand_less':'expand_more'}</span>
      </div>
      <div class="cat-tab-body ${cat.open?'open':''}" id="catbody-${cat.id}">
        <div><label>שם קטגוריה</label><input type="text" value="${esc(cat.name)}" oninput="S.categories[${ci}].name=this.value;updateCatHeader(${ci});rp()" placeholder="שם הקטגוריה..."/></div>
        <div><label>תיאור קצר (אופציונלי)</label><input type="text" value="${esc(cat.subtitle)}" oninput="S.categories[${ci}].subtitle=this.value;rp()" placeholder="תיאור..."/></div>
        <div class="prod-list" id="prods-${cat.id}"></div>
        <button class="add-btn" onclick="addProd(${ci})"><span class="ms" style="font-size:14px">add</span> הוסף מוצר</button>
      </div>`;
    // Cat drag events
    el.addEventListener('dragstart',e=>{
      if(e.target.closest('.acts')){e.preventDefault();return;}
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('type','cat');
      e.dataTransfer.setData('ci',ci);
      el.classList.add('dragging');
    });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('drag-over');
      const type=e.dataTransfer.getData('type');
      if(type!=='cat')return;
      const from=parseInt(e.dataTransfer.getData('ci'));
      const to=ci;
      if(from===to)return;
      const moved=S.categories.splice(from,1)[0];
      saveHistory();
      S.categories.splice(to,0,moved);
      if(previewCatIdx===from) previewCatIdx=to;
      else if(previewCatIdx>from&&previewCatIdx<=to) previewCatIdx--;
      else if(previewCatIdx<from&&previewCatIdx>=to) previewCatIdx++;
      renderCats();rp();
    });
    l.appendChild(el);
    if(cat.open) renderProds(ci);
  });
  document.getElementById('total-chip').textContent=total+' מוצרים';
}

function selectCat(ci){previewCatIdx=ci;renderCats();rp();}
function toggleCatBody(ci){S.categories[ci].open=!S.categories[ci].open;renderCats();}
function addCat(){saveHistory();
  const cat=makeCat('קטגוריה חדשה');cat.open=true;
  S.categories.push(cat);previewCatIdx=S.categories.length-1;
  renderCats();rp();
}
function rmCat(ci){saveHistory();
  if(S.categories.length===1){showToast('חייב להיות לפחות קטגוריה אחת');return;}
  if(!confirm('למחוק קטגוריה זו ואת כל מוצריה?'))return;
  S.categories.splice(ci,1);
  if(previewCatIdx>=S.categories.length) previewCatIdx=S.categories.length-1;
  renderCats();rp();
}

async function uploadImg(e,pid,ci,pi){saveHistory();
  const f=e.target.files[0];if(!f)return;
  const iz=document.getElementById('iz-'+pid);iz.classList.add('uploading');
  const fd=new FormData();fd.append('image',f);
  try{
    authFD(fd);const r=await fetch(`/api/pricelist/product-image/${pid}`,{method:'POST',body:fd});
    const d=await r.json();S.categories[ci].products[pi].imgUrl=d.imgUrl;
    renderCats();rp();showToast('תמונה עלתה ✓');
  }catch{showToast('שגיאה ✗');}
  iz.classList.remove('uploading');e.target.value='';
}
async function delImg(pid,ci,pi){saveHistory();
  await fetch(`/api/pricelist/product-image/${pid}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:authBody({})});
  S.categories[ci].products[pi].imgUrl=null;renderCats();rp();
}
async function uploadGalleryImg(e,pid,ci,pi){saveHistory();
  const f=e.target.files[0];if(!f)return;
  const gz=document.getElementById('galz-'+pid);if(gz)gz.style.opacity='.4';
  const fd=new FormData();fd.append('image',f);
  try{
    authFD(fd);const r=await fetch(`/api/pricelist/product-gallery/${pid}`,{method:'POST',body:fd});
    const d=await r.json();
    const p=S.categories[ci].products[pi];p.images=p.images||[];p.images.push({url:d.url,pid:d.pid});
    renderCats();rp();showToast('תמונה נוספה ✓');
  }catch{showToast('שגיאה ✗');}
  if(gz)gz.style.opacity='1';e.target.value='';
}
async function delGalleryImg(pid,ci,pi,imgPid){saveHistory();
  await fetch(`/api/pricelist/product-gallery/${pid}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:authBody({pid:imgPid})});
  const p=S.categories[ci].products[pi];p.images=(p.images||[]).filter(im=>im.pid!==imgPid);
  renderCats();rp();
}
function toggleProd(ci,pi){S.categories[ci].products[pi].open=!S.categories[ci].products[pi].open;renderProds(ci);}
function updP(ci,pi,k,v){S.categories[ci].products[pi][k]=v;updateCatHeader(ci);rp();}
function addProd(ci){saveHistory();const n=S.categories[ci].products.length+1;S.categories[ci].products.push(makeProd(n));renderCats();rp();}
function rmProd(ci,pi){saveHistory();S.categories[ci].products.splice(pi,1);renderCats();rp();}
function dupProd(ci,pi){
  saveHistory();
  const src=S.categories[ci].products[pi];
  const copy=JSON.parse(JSON.stringify(src));
  copy.id='p'+Date.now()+Math.random().toString(36).slice(2); // fresh id — keeps its own image/fields
  copy.name=(src.name||'מוצר')+' (עותק)';
  copy.open=true;
  S.categories[ci].products.splice(pi+1,0,copy); // insert right after the original
  renderCats();rp();
}

      <div class="pl-sec-head">
        <div class="pl-sec-title">${esc(cat.name||'')}</div>
        ${cat.subtitle?`<div class="pl-sec-sub">${esc(cat.subtitle)}</div>`:''}
      </div>
      <div class="pl-grid" style="grid-template-columns:repeat(${cols},1fr)">${cards}${fillers}</div>
      ${notesHTML}
    </div>
    <div class="pl-footer">
      <div class="pl-footer-brand">${esc(S.meta.company||'TADOR SYSTEMS')}</div>
      <div class="pl-footer-copy">© ${new Date().getFullYear()} ${esc(S.meta.footer||'')}</div>
    </div>`;
}

function jumpToProduct(catId, prodId){
  // Find cat index
  const ci = S.categories.findIndex(c=>c.id===catId);
  if(ci===-1) return;
  // Open that category
  S.categories[ci].open = true;
  previewCatIdx = ci;
  // Find product and open it
  const pi = S.categories[ci].products.findIndex(p=>p.id===prodId);
  if(pi!==-1) S.categories[ci].products[pi].open = true;
  renderCats();
  rp();
  // Scroll editor to that product
  setTimeout(()=>{
    const prodEl = document.getElementById('pie-'+prodId) || 
                   document.querySelector(`[id^="pie-"]`);
    if(prodEl){
      prodEl.scrollIntoView({behavior:'smooth', block:'center'});
      // Flash highlight
      prodEl.style.borderColor='var(--pr)';
      prodEl.style.boxShadow='0 0 0 3px rgba(186,0,19,.2)';
      setTimeout(()=>{prodEl.style.borderColor='';prodEl.style.boxShadow='';},1500);
    }
  },120);
}

// ── UNDO HISTORY ──
const history = [];
let historyIdx = -1;

function saveHistory(){
  const snap = JSON.stringify(S);
  // Remove future states if we branched
  history.splice(historyIdx + 1);
  history.push(snap);
  if(history.length > 30) history.shift();
  historyIdx = history.length - 1;
  updateUndoBtn();
}
function undo(){
  if(historyIdx <= 0) return;
  historyIdx--;
  S = JSON.parse(history[historyIdx]);
  syncUI(); renderCats(); rp();
  updateUndoBtn();
  showToast('בוטלה הפעולה האחרונה');
}
function updateUndoBtn(){
  const btn = document.getElementById('undo-btn');
  if(btn) btn.disabled = historyIdx <= 0;
}
function scrollCatList(dy){
  const el=document.getElementById('cat-list-wrap');
  if(el) el.scrollTop+=dy;
}
function sortProds(ci){S.categories[ci].products.sort((a,b)=>(a.order||0)-(b.order||0));renderProds(ci);rp();}
function updateCatHeader(ci){
  const cat=S.categories[ci];if(!cat)return;
  const el=document.querySelector(`#cat-list .cat-tab-item:nth-child(${ci+1}) .cat-count`);
  if(el) el.textContent=cat.products.length+' מוצרים';
  document.getElementById('total-chip').textContent=S.categories.reduce((a,c)=>a+c.products.length,0)+' מוצרים';
}
function scrollPLCats(dx){
  const el=document.getElementById('pl-cats-inner');
  if(el){el.scrollLeft+=dx;}
}
function rp(){rm();document.getElementById('pl-render').innerHTML=buildPL();}
function setVP(m,btn){isMob=m==='m';document.getElementById('pv-frame').className='pv-frame'+(isMob?' mob':'');document.querySelectorAll('.vp-tog button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');rp();}

function setSS(m,c){const el=document.getElementById('save-st');el.textContent=m;el.className='save-st'+(c?' '+c:'');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sv(id,v){const el=document.getElementById(id);if(el)el.value=v||'';}
function gv(id){const el=document.getElementById(id);return el?el.value:'';}

['meta-company','meta-year','meta-footer'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',rp);});
document.getElementById('cols-sel').addEventListener('change',rp);
</script>
